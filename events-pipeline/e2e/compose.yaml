services:
  nats-0:
    image: nats:2.14.5-alpine@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da
    command: ["--config", "/etc/nats/nats.conf"]
    environment:
      NATS_SERVER_NAME: e2e-n0
      JS_ENCRYPTION_KEY: helpin-e2e-only-jetstream-key
    volumes:
      - ./nats-secure.conf:/etc/nats/nats.conf:ro
      - ${E2E_NATS_TLS_DIR:-./fixtures/nats-tls}:/etc/nats/tls:ro
    ports:
      - "14222:4222"
      - "18222:8222"
    mem_limit: 1g
    cpus: 2

  nats-1:
    image: nats:2.14.5-alpine@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da
    command: ["--config", "/etc/nats/nats.conf"]
    environment:
      NATS_SERVER_NAME: e2e-n1
      JS_ENCRYPTION_KEY: helpin-e2e-only-jetstream-key
    volumes:
      - ./nats-secure.conf:/etc/nats/nats.conf:ro
      - ${E2E_NATS_TLS_DIR:-./fixtures/nats-tls}:/etc/nats/tls:ro
    ports:
      - "18223:8222"
    mem_limit: 1g
    cpus: 2

  nats-2:
    image: nats:2.14.5-alpine@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da
    command: ["--config", "/etc/nats/nats.conf"]
    environment:
      NATS_SERVER_NAME: e2e-n2
      JS_ENCRYPTION_KEY: helpin-e2e-only-jetstream-key
    volumes:
      - ./nats-secure.conf:/etc/nats/nats.conf:ro
      - ${E2E_NATS_TLS_DIR:-./fixtures/nats-tls}:/etc/nats/tls:ro
    ports:
      - "18224:8222"
    mem_limit: 1g
    cpus: 2

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: usermaven
      CLICKHOUSE_USER: helpin
      CLICKHOUSE_PASSWORD: helpin
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "18123:8123"
      - "19000:9000"
    mem_limit: 3g
    cpus: 2
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user helpin --password helpin --query 'SELECT 1' >/dev/null 2>&1
      interval: 2s
      timeout: 2s
      retries: 30
