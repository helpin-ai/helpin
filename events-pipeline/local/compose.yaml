services:
  nats:
    image: nats:2.14.5-alpine@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: helpin
      CLICKHOUSE_PASSWORD: helpin
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ../e2e/clickhouse-replication.xml:/etc/clickhouse-server/config.d/replication.xml:ro
      - ../e2e/clickhouse-local-storage.xml:/etc/clickhouse-server/config.d/events-storage.xml:ro
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    mem_limit: 1g
    cpus: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user helpin --password helpin --query 'SELECT 1' >/dev/null 2>&1
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  nats_data:
  clickhouse_data:
