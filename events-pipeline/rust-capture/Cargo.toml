[package]
license = "AGPL-3.0-only"
name = "events-pipeline"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

default-run = "events-pipeline"

[dependencies]
axum = "0.6.18"
tokio = { version = "1.28.2", features = ["full", "tracing"] }
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.96"
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
anyhow = "1.0.71"
uuid = { version = "1.3.3", features = ["serde", "v4"] }
flate2 = "1.0.26"
async-trait = "0.1.68"
arc-swap = "1.7"
async-nats = "0.50.0"
serde_urlencoded = "0.7.1"
base64 = "0.21.2"
tower-http = { version = "0.4.0", features = ["trace", "cors"] }
governor = "0.5.1"
tower_governor = "0.0.4"
bytes = "1.4.0"
time = { version = "0.3.21", features = ["formatting"] }
axum-macros = "0.3.7"
reqwest = { version = "0.11.18", features = ["json"] }
metrics = "0.21.0"
metrics-exporter-prometheus = "0.12.1"
rand = "0.8.5"
dotenv = "0.15.0"
maxminddb = "0.23.0"
md5 = "0.7.0"
tar = "0.4.38"
walkdir = "2.3.3"
isbot = "0.1.3"
serde_yaml = "0.9.21"
regex = "1.8.4"
uaparser = "0.6.0"
futures = "0.3.28"
clap = "4.3.3"
stream-cancel = "0.8.1"
tokio-stream = "0.1.14"
oneshot = "0.1.5"
yaml-rust = "0.4.5"
lazy_static = "1.4.0"
console-subscriber = "0.1.9"
moka = "0.11.2"
mockito = "1.1.0"
sentry = { version = "0.31.5", features = ["anyhow", "tower", "tower-http"] }
clickhouse = "0.11.5"
klickhouse = "0.9.0"
chrono = "0.4.38"
zip = "2.1.3"
ip2proxy = "2.0.1"
sentry-tracing = "0.34.0"
url = "2.5"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"


[[bin]]
name = "replay-worker"
path = "src/replay_worker.rs"

[[bin]]
name = "nats-bootstrap"
path = "src/nats_bootstrap.rs"

[[bin]]
name = "session-writer"
path = "src/session_writer.rs"
