map $http_upgrade $connection_upgrade { default upgrade; '' close; }
resolver 127.0.0.11 valid=5s ipv6=off;
upstream community_api {
    zone community_api 64k;
    server helpin-api:8080 resolve;
}
# Widget session tokens may be query parameters. Never log args or Referer.
log_format community '$remote_addr $request_method $uri $status $body_bytes_sent';
geo $realip_remote_addr $trusted_edge {
    default 0;
    ${COMMUNITY_TRUSTED_PROXY_CIDR} 1;
}
map "$trusted_edge:$http_x_forwarded_proto" $forwarded_proto { default $scheme; "1:https" https; "1:http" http; }
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log community;
    client_max_body_size 32m;
    set_real_ip_from ${COMMUNITY_TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # Internal callback endpoints are reachable only on the private network.
    location ^~ /api/internal/ { return 404; }
    location ^~ /api/admin/ { return 404; }
    location ~ ^/(api|widget|sdk)/ {
        proxy_pass http://community_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location = /healthz { access_log off; return 200 'ok'; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; }
}
