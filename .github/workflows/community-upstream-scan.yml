name: Community upstream image scan

# New CVEs in the pinned upstream images (PostgreSQL, Redis, NATS, Garage,
# Temporal, Caddy) used to surface only when a release scan stopped on them.
# Scan them every morning on both architectures and open an issue instead.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    paths:
      - community/check-upstream-images.sh
      - community/verify-image-findings.py
      - community/upstream-image-exceptions.json
      - .github/workflows/community-upstream-scan.yml

permissions:
  contents: read

concurrency:
  group: community-upstream-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan (${{ matrix.architecture }})
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    env:
      COMMUNITY_ARCH: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-verified Trivy
        run: bash scripts/ci/install-tool.sh trivy
      - name: Scan pinned upstream images
        run: |
          set -o pipefail
          community/check-upstream-images.sh 2>&1 | tee "$RUNNER_TEMP/scan.log"
      - name: Keep findings for the report
        if: failure()
        run: |
          grep -hE '^(FAIL|EXPIRING):|Unreviewed vulnerability' "$RUNNER_TEMP/scan.log" > "$RUNNER_TEMP/findings-$COMMUNITY_ARCH.txt" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: upstream-findings-${{ matrix.architecture }}
          path: ${{ runner.temp }}/findings-${{ matrix.architecture }}.txt
          retention-days: 14

  report:
    name: Open or update the tracking issue
    needs: scan
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: upstream-findings-*
          path: findings
          merge-multiple: true
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Community upstream image scan is failing'
          {
            echo "The daily scan of pinned upstream images failed: $RUN_URL"
            echo
            echo '```'
            cat findings/*.txt 2>/dev/null || echo 'See the run log.'
            echo '```'
            echo
            echo 'Pin a patched upstream image, or review the finding and add a time-limited exception to `community/upstream-image-exceptions.json` with a note in `docs/community/upstream-images.md`.'
          } > body.md
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [[ -n $existing ]]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
