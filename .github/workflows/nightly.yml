name: Nightly

# Slow / flaky / browser suites that don't fit the PR runtime budget.
# See `docs/plans/test-suite-ci-email-plan.md` "Layer 3: Nightly Integration".
#
# Runs:
# - On a daily schedule (02:30 UTC ≈ 19:30 PT, off-peak for self-hosted runners).
# - On manual workflow_dispatch when an engineer wants to validate ahead of merge.
#
# Failures here do NOT block PRs; they feed the promote-to-required signal.

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # `go test -race` against full backend with Postgres service. Race builds
  # are slow and noisy (~3x test runtime) — fine for nightly, never on PR.
  server-race:
    name: Server (-race)
    runs-on: arc-runners-helpin-ai
    # -race adds ~3x runtime over plain go test; plan budget allows generous.
    timeout-minutes: 45
    # Postgres service intentionally omitted — the in-cluster k8s API
    # currently can't spin up service sidecar pods on our ARC runners.
    # Existing test suite uses in-memory SQLite. Postgres-backed nightly
    # tests will land once the runner story is sorted.
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: server/go.sum
      - name: Verify gcc available
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            (command -v sudo >/dev/null 2>&1 && sudo apt-get update && sudo apt-get install -y gcc) \
              || (apt-get update && apt-get install -y gcc) || true
          fi
      - name: Test with race detector
        working-directory: server
        run: go test -race ./...

  # Mocked support inbox Playwright suite. Deterministic — no external services.
  playwright-support:
    name: Playwright (support, mocked)
    runs-on: arc-runners-helpin-ai
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build widget-core (frontend imports compiled output)
        run: pnpm --filter @helpin-ai/widget-core build
      - name: Install Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Run support Playwright suite
        run: pnpm --dir frontend run test:e2e:support
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-support-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # Mocked SDK widget Playwright suite.
  playwright-widget:
    name: Playwright (widget, mocked)
    runs-on: arc-runners-helpin-ai
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir packages/sdk-js exec playwright install --with-deps chromium
      - name: Run widget Playwright suite
        # The package script builds the SDK before starting the browser tests.
        run: pnpm --dir packages/sdk-js run test:e2e:widget
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-widget-report
          path: |
            packages/sdk-js/playwright-report
            packages/sdk-js/test-results
          retention-days: 7
