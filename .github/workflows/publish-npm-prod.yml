# Publish npm packages (production) on merge to main
# Packages: @helpin-ai/sdk-js, @helpin-ai/react, @helpin-ai/nextjs, @helpin-ai/vue
# Required GitHub secrets: NODE_AUTH_TOKEN (npm access token)

name: Publish npm Packages (Production)

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - "packages/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
    name: Build & Publish
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false

          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Generate Release version
        id: release_version
        run: |
          LATEST_TAG=$(git tag | grep -E "^[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="0.0.0"
          fi
          IFS='.' read -r -a version_parts <<< "$LATEST_TAG"
          MAJOR="${version_parts[0]}"
          MINOR="${version_parts[1]}"
          PATCH="${version_parts[2]}"
          NEW_PATCH=$((PATCH + 1))
          RELEASE_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${RELEASE_VERSION}"

      - name: Update package versions
        run: |
          VERSION=${{ steps.release_version.outputs.RELEASE_VERSION }}
          for pkg in packages/shared packages/widget-core packages/sdk-js packages/react packages/nextjs packages/vue; do
            if [ -d "$pkg/package.json" ] || [ -f "$pkg/package.json" ]; then
              node -e "const p=require('./$pkg/package.json'); p.version='$VERSION'; require('fs').writeFileSync('./$pkg/package.json', JSON.stringify(p, null, 2) + '\n')"
            fi
          done

      - name: Tag release
        run: |
          VERSION=${{ steps.release_version.outputs.RELEASE_VERSION }}
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag $VERSION
          git push origin $VERSION

      - name: Publish SDK package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NPM_CONFIG_PROVENANCE: false
        run: |
          cd packages/sdk-js
          pnpm publish --no-git-checks --access public

      - name: Publish React package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NPM_CONFIG_PROVENANCE: false
        run: |
          cd packages/react
          pnpm publish --no-git-checks --access public

      - name: Publish Next.js package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NPM_CONFIG_PROVENANCE: false
        run: |
          cd packages/nextjs
          pnpm publish --no-git-checks --access public

      - name: Publish Vue package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NPM_CONFIG_PROVENANCE: false
        run: |
          cd packages/vue
          pnpm publish --no-git-checks --access public
