name: Staging Release

on:
  push:
    branches:
      - develop
    paths-ignore:
      - "k8s/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Build all services regardless of changes"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: staging-build
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/helpin-ai/helpin

jobs:
  changes:
    name: Detect Changes
    runs-on: arc-runners-helpin-ai
    outputs:
      server: ${{ steps.filter.outputs.server }}
      helpcenter: ${{ steps.filter.outputs.helpcenter }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: filter
        run: |
          FORCE_ALL="${{ github.event.inputs.force_all || 'false' }}"

          if [ "$FORCE_ALL" = "true" ]; then
            echo "Force all: building everything"
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "helpcenter=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          SERVER=false
          HELPCENTER=false
          FRONTEND=false

          if echo "$CHANGED" | grep -qE '^server/'; then
            SERVER=true
          fi
          if echo "$CHANGED" | grep -qE '^help-center/'; then
            HELPCENTER=true
          fi
          if echo "$CHANGED" | grep -qE '^(frontend/|packages/)'; then
            FRONTEND=true
          fi
          if echo "$CHANGED" | grep -qE '^(pnpm-lock\.yaml|pnpm-workspace\.yaml)$'; then
            HELPCENTER=true
            FRONTEND=true
          fi

          echo "server=$SERVER" >> "$GITHUB_OUTPUT"
          echo "helpcenter=$HELPCENTER" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "Detected: server=$SERVER helpcenter=$HELPCENTER frontend=$FRONTEND"

  version:
    name: Determine RC Versions
    runs-on: arc-runners-helpin-ai
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.helpcenter == 'true'
    outputs:
      server_tag: ${{ steps.versions.outputs.server_tag }}
      helpcenter_tag: ${{ steps.versions.outputs.helpcenter_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute per-service RC versions
        id: versions
        run: |
          compute_rc_version() {
            local PREFIX=$1
            local CHANGED=$2

            if [ "$CHANGED" != "true" ]; then
              echo ""
              return
            fi

            # Get latest stable tag for this service
            LATEST=$(git tag -l "${PREFIX}-v*" --sort=-v:refname | grep -vE '\-rc\.' | head -n1 || echo "")

            if [ -z "$LATEST" ]; then
              echo "${PREFIX}-v0.1.0-rc.1"
              return
            fi

            # Extract version and bump patch
            VERSION=${LATEST#${PREFIX}-v}
            IFS='.' read -ra P <<< "$VERSION"
            MAJOR=${P[0]:-0}
            MINOR=${P[1]:-0}
            PATCH=${P[2]:-0}
            PATCH=$((PATCH + 1))

            BASE="${PREFIX}-v${MAJOR}.${MINOR}.${PATCH}"

            # Find highest existing RC for this base
            LATEST_RC=$(git tag -l "${BASE}-rc.*" --sort=-v:refname | head -n1 || echo "")
            if [ -n "$LATEST_RC" ]; then
              RC_NUM=$(echo "$LATEST_RC" | sed "s/${BASE}-rc\.//")
              RC_NUM=$((RC_NUM + 1))
            else
              RC_NUM=1
            fi

            echo "${BASE}-rc.${RC_NUM}"
          }

          SERVER_TAG=$(compute_rc_version "server" "${{ needs.changes.outputs.server }}")
          HELPCENTER_TAG=$(compute_rc_version "helpcenter" "${{ needs.changes.outputs.helpcenter }}")

          echo "server_tag=$SERVER_TAG" >> "$GITHUB_OUTPUT"
          echo "helpcenter_tag=$HELPCENTER_TAG" >> "$GITHUB_OUTPUT"
          echo "Server RC: ${SERVER_TAG:-skipped}"
          echo "Helpcenter RC: ${HELPCENTER_TAG:-skipped}"

  build-server:
    name: Build Server Image
    runs-on: arc-runners-helpin-ai
    needs: [version, changes]
    if: needs.changes.outputs.server == 'true' && needs.version.outputs.server_tag != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: build-stg-server

      - name: Prepare Docker socket
        run: |
          if [ -S /var/run/docker.sock ]; then
            sudo chmod 666 /var/run/docker.sock || true
          fi
          docker version

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push server images
        run: |
          docker buildx build \
            -f build-stg-server/server/Dockerfile \
            --target api \
            -t ${{ env.IMAGE_PREFIX }}/server:${{ needs.version.outputs.server_tag }} \
            -t ${{ env.IMAGE_PREFIX }}/server:sha-${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}/server:stage-latest \
            --push \
            build-stg-server/server/
          docker buildx build \
            -f build-stg-server/server/Dockerfile \
            --target temporal-worker \
            -t ${{ env.IMAGE_PREFIX }}/temporal-worker:${{ needs.version.outputs.server_tag }} \
            -t ${{ env.IMAGE_PREFIX }}/temporal-worker:sha-${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}/temporal-worker:stage-latest \
            --push \
            build-stg-server/server/
          docker buildx build \
            -f build-stg-server/server/Dockerfile \
            --target migrate \
            -t ${{ env.IMAGE_PREFIX }}/server-migrate:${{ needs.version.outputs.server_tag }} \
            -t ${{ env.IMAGE_PREFIX }}/server-migrate:sha-${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}/server-migrate:stage-latest \
            --push \
            build-stg-server/server/

  build-helpcenter:
    name: Build Help Center Image
    runs-on: arc-runners-helpin-ai
    needs: [version, changes]
    if: needs.changes.outputs.helpcenter == 'true' && needs.version.outputs.helpcenter_tag != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: build-stg-helpcenter

      - name: Prepare Docker socket
        run: |
          if [ -S /var/run/docker.sock ]; then
            sudo chmod 666 /var/run/docker.sock || true
          fi
          docker version

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push helpcenter image
        run: |
          docker buildx build \
            -f build-stg-helpcenter/help-center/Dockerfile \
            -t ${{ env.IMAGE_PREFIX }}/helpcenter:${{ needs.version.outputs.helpcenter_tag }} \
            -t ${{ env.IMAGE_PREFIX }}/helpcenter:sha-${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}/helpcenter:stage-latest \
            --push \
            build-stg-helpcenter/help-center/

  deploy-netlify:
    name: Build & Deploy Frontend to Netlify
    runs-on: arc-runners-helpin-ai
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: build-stg-netlify

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Doppler CLI
        run: curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sudo sh

      - name: Download secrets to .env
        run: |
          cd build-stg-netlify/frontend
          doppler secrets download -t ${{ secrets.DOPPLER_TOKEN_FRONTEND_STAGE }} --format=env-no-quotes --no-file > .env

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install and build frontend
        run: |
          cd build-stg-netlify
          pnpm install --no-frozen-lockfile
          NODE_OPTIONS=--max-old-space-size=8192 pnpm \
            --filter @helpin-ai/sdk-js... \
            --filter @helpin-ai/widget-embed... \
            --filter @helpin-ai/react... \
            --filter @helpin-ai/nextjs... \
            --filter frontend... \
            build

      - name: Link Netlify site
        working-directory: build-stg-netlify
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_STAGE }}
        run: |
          mkdir -p .netlify
          printf '{\"siteId\":\"%s\"}\n' "$NETLIFY_SITE_ID" > .netlify/state.json

      - name: Deploy to Netlify
        working-directory: build-stg-netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: pnpm --package=netlify-cli@24.2.0 dlx netlify deploy --filter frontend --dir frontend/dist --no-build --prod-if-unlocked

  release:
    name: Create RC Release & Update Manifests
    runs-on: arc-runners-helpin-ai
    needs: [version, changes, build-server, build-helpcenter]
    if: |
      always() &&
      needs.version.result == 'success' &&
      (needs.build-server.result == 'success' || needs.build-helpcenter.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          path: stg-release

      - name: Configure git
        working-directory: stg-release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push per-service RC tags
        working-directory: stg-release
        run: |
          SERVER_TAG="${{ needs.version.outputs.server_tag }}"
          HELPCENTER_TAG="${{ needs.version.outputs.helpcenter_tag }}"

          for TAG in "$SERVER_TAG" "$HELPCENTER_TAG"; do
            if [ -n "$TAG" ]; then
              if git rev-parse "$TAG" >/dev/null 2>&1; then
                git tag -d "$TAG" || true
                git push origin ":refs/tags/$TAG" || true
              fi
              git tag -a "$TAG" -m "Release Candidate $TAG"
              git push origin "$TAG"
              echo "Created tag: $TAG"
            fi
          done

      - name: Generate release notes
        working-directory: stg-release
        run: |
          SERVER_TAG="${{ needs.version.outputs.server_tag }}"
          HELPCENTER_TAG="${{ needs.version.outputs.helpcenter_tag }}"

          TITLE_PARTS=""
          [ -n "$SERVER_TAG" ] && TITLE_PARTS="$SERVER_TAG"
          [ -n "$HELPCENTER_TAG" ] && TITLE_PARTS="${TITLE_PARTS:+$TITLE_PARTS, }$HELPCENTER_TAG"

          # Use the first available tag as the release tag name
          RELEASE_NAME=""
          [ -n "$SERVER_TAG" ] && RELEASE_NAME="$SERVER_TAG"
          [ -z "$RELEASE_NAME" ] && RELEASE_NAME="$HELPCENTER_TAG"

          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)")
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" -20)
          fi

          cat > release_notes.md << EOF
          ## Staging Release: $TITLE_PARTS

          ### Changes
          $COMMITS

          ### Images
          EOF

          if [ -n "$SERVER_TAG" ]; then
            echo "- \`${{ env.IMAGE_PREFIX }}/server:$SERVER_TAG\`" >> release_notes.md
            echo "- \`${{ env.IMAGE_PREFIX }}/temporal-worker:$SERVER_TAG\`" >> release_notes.md
            echo "- \`${{ env.IMAGE_PREFIX }}/server-migrate:$SERVER_TAG\`" >> release_notes.md
          fi
          [ -n "$HELPCENTER_TAG" ] && echo "- \`${{ env.IMAGE_PREFIX }}/helpcenter:$HELPCENTER_TAG\`" >> release_notes.md

          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"

      - name: Install GitHub CLI
        run: |
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          sudo mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y gh
          gh --version

      - name: Create GitHub pre-release
        working-directory: stg-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$RELEASE_NAME" --yes 2>/dev/null || true
          gh release create "$RELEASE_NAME" \
            --title "Staging: $RELEASE_NAME" \
            --notes-file release_notes.md \
            --prerelease

      - name: Update K8s manifests
        run: |
          SERVER_TAG="${{ needs.version.outputs.server_tag }}"
          HELPCENTER_TAG="${{ needs.version.outputs.helpcenter_tag }}"

          MANIFEST_CLONE="${GITHUB_WORKSPACE}/../k8s-helpin-stg"
          rm -rf "$MANIFEST_CLONE"
          git clone --depth 1 --branch develop "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$MANIFEST_CLONE"
          cd "$MANIFEST_CLONE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          MANIFEST_DIR="k8s/stage"
          UPDATED=""

          if [ -n "$SERVER_TAG" ]; then
            SERVER_IMAGE="${{ env.IMAGE_PREFIX }}/server:${SERVER_TAG}"
            TEMPORAL_IMAGE="${{ env.IMAGE_PREFIX }}/temporal-worker:${SERVER_TAG}"
            MIGRATE_IMAGE="${{ env.IMAGE_PREFIX }}/server-migrate:${SERVER_TAG}"
            sed -i -E "s|ghcr\.io/helpin-ai/helpin/server:[^ \"]+|${SERVER_IMAGE}|g" "$MANIFEST_DIR/server.yaml"
            sed -i -E "s|ghcr\.io/helpin-ai/helpin/server:[^ \"]+|${SERVER_IMAGE}|g" "$MANIFEST_DIR/git-pr-status-reconciler.yaml"
            sed -i -E "s|ghcr\.io/helpin-ai/helpin/server:[^ \"]+|${MIGRATE_IMAGE}|g; s|ghcr\.io/helpin-ai/helpin/server-migrate:[^ \"]+|${MIGRATE_IMAGE}|g" "$MANIFEST_DIR/server-migrate.yaml"
            sed -i -E "s|ghcr\.io/helpin-ai/helpin/server:[^ \"]+|${TEMPORAL_IMAGE}|g; s|ghcr\.io/helpin-ai/helpin/temporal-worker:[^ \"]+|${TEMPORAL_IMAGE}|g" "$MANIFEST_DIR/temporal-worker.yaml"
            UPDATED="${UPDATED:+$UPDATED, }server-family→$SERVER_TAG"
          fi

          if [ -n "$HELPCENTER_TAG" ]; then
            HELPCENTER_IMAGE="${{ env.IMAGE_PREFIX }}/helpcenter:${HELPCENTER_TAG}"
            find "$MANIFEST_DIR" -name "*.yaml" -exec \
              sed -i -E "s|ghcr\.io/helpin-ai/helpin/helpcenter:[^ \"]+|${HELPCENTER_IMAGE}|g" {} +
            UPDATED="${UPDATED:+$UPDATED, }helpcenter→$HELPCENTER_TAG"
          fi

          git add k8s/
          git commit -m "chore: update stage images ($UPDATED) [skip ci]" || echo "No manifest changes"
          git pull --rebase origin develop
          git push origin develop
