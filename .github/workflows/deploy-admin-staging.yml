# Deploy Admin Panel (Staging) to Cloudflare Pages
# Cloudflare Pages project:
#   - helpin-admin-stage (staging): ctrl-stage.helpin.ai
# Required GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy Admin to Cloudflare Pages (Staging)

on:
  push:
    branches: [develop]
    paths:
      - "apps/admin/**"
      - "frontend/src/index.css"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-admin-staging.yml"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Run regardless of changed paths"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: admin-deploy-staging-${{ github.ref_name }}
  cancel-in-progress: true

env:
  VITE_API_URL: https://api.stage.helpin.ai/api
  VITE_MAIN_APP_URL: https://app.stage.helpin.ai

jobs:
  build:
    name: Build Admin (staging)
    runs-on: arc-runners-helpin-ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: '22'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build admin app
        run: pnpm --dir apps/admin run build

      - name: Prepare Cloudflare Pages artifact
        run: |
          rm -rf admin-pages-dist
          mkdir -p admin-pages-dist/admin
          cp -R apps/admin/dist/. admin-pages-dist/admin/
          printf '/ /admin/ 302\n/admin/* /admin/index.html 200\n' > admin-pages-dist/_redirects

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-pages-dist-stage
          path: admin-pages-dist

  deploy-staging:
    name: Deploy to Staging (ctrl-stage.helpin.ai)
    runs-on: arc-runners-helpin-ai
    needs: build
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: admin-pages-dist-stage
          path: dist

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Ensure Cloudflare Pages project exists
        run: npx wrangler@3.114.1 pages project create helpin-admin-stage --production-branch=develop 2>/dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.1'
          command: pages deploy dist --project-name=helpin-admin-stage --branch=develop
