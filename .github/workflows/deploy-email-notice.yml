# Deploy Email Notice Page to Cloudflare Pages
# Cloudflare Pages projects:
#   - helpin-email-notice (production): helpin.email + *.helpin.email + *.on.helpin.email
# Required GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy Email Notice to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/email-notice/**"
      - ".github/workflows/deploy-email-notice.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-notice-deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-production:
    name: Deploy to Production (helpin.email)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Ensure Cloudflare Pages project exists
        run: npx wrangler@3.114.1 pages project create helpin-email-notice --production-branch=main 2>/dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.1'
          command: pages deploy apps/email-notice/public --project-name=helpin-email-notice --branch=main
