name: Events Pipeline - Staging

on:
  push:
    branches: [develop]
    paths:
      - 'events-pipeline/**'
      - '.github/workflows/eventpipeline-staging.yml'
  workflow_dispatch:
    inputs:
      force_all:
        description: "Run regardless of changed paths"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: eventpipeline-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RUST_IMAGE: ghcr.io/helpin-ai/helpin/events-pipeline

jobs:
  version:
    runs-on: arc-runners-helpin-ai
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine RC version
        id: version
        run: |
          # Mirror deploy-staging.yml's compute_rc_version pattern, scoped to ep-stage.
          PREFIX="ep-stage"

          LATEST_STABLE=$(git tag -l "ep-v*" --sort=-v:refname | grep -vE '\-rc\.' | head -n1 || echo "")
          if [ -z "$LATEST_STABLE" ]; then
            BASE_VERSION="0.1.0"
          else
            VERSION=${LATEST_STABLE#ep-v}
            IFS='.' read -ra P <<< "$VERSION"
            MAJOR=${P[0]:-0}
            MINOR=${P[1]:-0}
            PATCH=${P[2]:-0}
            PATCH=$((PATCH + 1))
            BASE_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          BASE="${PREFIX}-v${BASE_VERSION}"
          LATEST_RC=$(git tag -l "${BASE}-rc.*" --sort=-v:refname | head -n1 || echo "")
          if [ -n "$LATEST_RC" ]; then
            RC_NUM=$(echo "$LATEST_RC" | sed "s/${BASE}-rc\.//")
            RC_NUM=$((RC_NUM + 1))
          else
            RC_NUM=1
          fi

          TAG="${BASE}-rc.${RC_NUM}"
          echo "version=${BASE_VERSION}-rc.${RC_NUM}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Staging RC: ${TAG}"

  build-rust:
    needs: version
    runs-on: arc-runners-helpin-ai
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Docker socket
        run: |
          if [ -S /var/run/docker.sock ]; then
            sudo chmod 666 /var/run/docker.sock || true
          fi
          docker version
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Rust capture image
        uses: docker/build-push-action@v5
        with:
          context: events-pipeline/rust-capture
          push: true
          tags: |
            ${{ env.RUST_IMAGE }}:stage-latest
            ${{ env.RUST_IMAGE }}:${{ needs.version.outputs.tag }}
          cache-from: type=gha,scope=ep-stage-rust
          cache-to: type=gha,mode=max,scope=ep-stage-rust

  release:
    needs: [version, build-rust]
    runs-on: arc-runners-helpin-ai
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create git tag
        run: |
          git tag ${{ needs.version.outputs.tag }}
          git push origin ${{ needs.version.outputs.tag }}
      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "Staging: Events Pipeline ${{ needs.version.outputs.version }}"
          generate_release_notes: true
          prerelease: true
      - name: Update K8s manifests
        run: |
          sed -i "s|${{ env.RUST_IMAGE }}:[^ ]*|${{ env.RUST_IMAGE }}:${{ needs.version.outputs.tag }}|g" k8s/stage/events-pipeline/deployments/eventpipeline-web.yaml
          sed -i "s|${{ env.RUST_IMAGE }}:[^ ]*|${{ env.RUST_IMAGE }}:${{ needs.version.outputs.tag }}|g" k8s/stage/events-pipeline/deployments/eventpipeline-writer.yaml
          if git diff --quiet; then
            echo "No manifest changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add k8s/stage/events-pipeline/
            git commit -m "chore: update helpin events-pipeline stage images to ${{ needs.version.outputs.tag }} [skip ci]"
            git pull --rebase origin develop
            git push origin develop
          fi
