name: Production Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Build all services regardless of changes"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/helpin-ai/helpin

jobs:
  changes:
    name: Detect Changes
    runs-on: arc-runners-helpin-ai
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      server: ${{ steps.filter.outputs.server }}
      helpcenter: ${{ steps.filter.outputs.helpcenter }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        run: |
          FORCE_ALL="${{ github.event.inputs.force_all || 'false' }}"

          if [ "$FORCE_ALL" = "true" ]; then
            echo "Force all: building everything"
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "helpcenter=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="${{ github.event.before || '' }}"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BASE" HEAD)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          fi
          echo "Changed files:"
          echo "$CHANGED"

          SERVER=false
          HELPCENTER=false
          FRONTEND=false

          if echo "$CHANGED" | grep -qE '^server/'; then
            SERVER=true
          fi
          if echo "$CHANGED" | grep -qE '^help-center/'; then
            HELPCENTER=true
          fi
          if echo "$CHANGED" | grep -qE '^(frontend/|packages/)'; then
            FRONTEND=true
          fi
          if echo "$CHANGED" | grep -qE '^(pnpm-lock\.yaml|pnpm-workspace\.yaml)$'; then
            HELPCENTER=true
            FRONTEND=true
          fi

          echo "server=$SERVER" >> "$GITHUB_OUTPUT"
          echo "helpcenter=$HELPCENTER" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "Detected: server=$SERVER helpcenter=$HELPCENTER frontend=$FRONTEND"

  version:
    name: Determine Release Versions
    runs-on: arc-runners-helpin-ai
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.helpcenter == 'true'
    outputs:
      server_tag: ${{ steps.versions.outputs.server_tag }}
      server_prev: ${{ steps.versions.outputs.server_prev }}
      helpcenter_tag: ${{ steps.versions.outputs.helpcenter_tag }}
      helpcenter_prev: ${{ steps.versions.outputs.helpcenter_prev }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute per-service release versions
        id: versions
        run: |
          compute_release_version() {
            local PREFIX=$1
            local CHANGED=$2

            if [ "$CHANGED" != "true" ]; then
              echo "tag="
              echo "prev="
              return
            fi

            # Check for RC to promote
            LATEST_RC=$(git tag -l "${PREFIX}-v*-rc.*" --sort=-v:refname | head -n1 || echo "")
            PREV_STABLE=$(git tag -l "${PREFIX}-v*" --sort=-v:refname | grep -vE '\-(rc|dev)\.' | head -n1 || echo "")

            if [ -n "$LATEST_RC" ]; then
              # Promote RC: server-v1.2.3-rc.2 → server-v1.2.3
              RELEASE_TAG=$(echo "$LATEST_RC" | sed 's/-rc\.[0-9]*//')
            elif [ -n "$PREV_STABLE" ]; then
              # No RC — bump patch from latest stable
              VERSION=${PREV_STABLE#${PREFIX}-v}
              IFS='.' read -ra P <<< "$VERSION"
              MAJOR=${P[0]:-0}; MINOR=${P[1]:-0}; PATCH=${P[2]:-0}
              PATCH=$((PATCH + 1))
              RELEASE_TAG="${PREFIX}-v${MAJOR}.${MINOR}.${PATCH}"
            else
              RELEASE_TAG="${PREFIX}-v0.1.0"
            fi

            # Guard: don't re-release an existing tag
            if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "tag="
              echo "prev=$PREV_STABLE"
              return
            fi

            echo "tag=$RELEASE_TAG"
            echo "prev=$PREV_STABLE"
          }

          SERVER_OUT=$(compute_release_version "server" "${{ needs.changes.outputs.server }}")
          SERVER_TAG=$(echo "$SERVER_OUT" | grep '^tag=' | cut -d= -f2)
          SERVER_PREV=$(echo "$SERVER_OUT" | grep '^prev=' | cut -d= -f2)

          HELPCENTER_OUT=$(compute_release_version "helpcenter" "${{ needs.changes.outputs.helpcenter }}")
          HELPCENTER_TAG=$(echo "$HELPCENTER_OUT" | grep '^tag=' | cut -d= -f2)
          HELPCENTER_PREV=$(echo "$HELPCENTER_OUT" | grep '^prev=' | cut -d= -f2)

          echo "server_tag=$SERVER_TAG" >> "$GITHUB_OUTPUT"
          echo "server_prev=$SERVER_PREV" >> "$GITHUB_OUTPUT"
          echo "helpcenter_tag=$HELPCENTER_TAG" >> "$GITHUB_OUTPUT"
          echo "helpcenter_prev=$HELPCENTER_PREV" >> "$GITHUB_OUTPUT"

          echo "Server release: ${SERVER_TAG:-skipped}"
          echo "Helpcenter release: ${HELPCENTER_TAG:-skipped}"

  build-server:
    name: Build Server Image
    runs-on: arc-runners-helpin-ai
    needs: [version, changes]
    if: needs.changes.outputs.server == 'true' && needs.version.outputs.server_tag != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: build-prod-server

      - name: Prepare Docker socket
        run: |
          if [ -S /var/run/docker.sock ]; then
            sudo chmod 666 /var/run/docker.sock || true
          fi
          docker version

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push server images
        run: |
          docker buildx build \
            -f build-prod-server/server/Dockerfile \
            --target api \
            -t ${{ env.IMAGE_PREFIX }}/server:${{ needs.version.outputs.server_tag }} \
            -t ${{ env.IMAGE_PREFIX }}/server:sha-${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}/server:prod-latest \
            --cache-from type=registry,ref=${{ env.IMAGE_PREFIX }}/server-buildcache:prod-api \
            --cache-to type=registry,ref=${{ env.IMAGE_PREFIX }}/server-buildcache:prod-api,mode=max \
            --push \
            build-prod-server/server/
          docker buildx build \
            -f build-prod-server/server/Dockerfile \
            --target temporal-worker \
            -t ${{ env.IMAGE_PREFIX }}/temporal-worker:${{ needs.version.outputs.server_tag }} \
            -t ${{ env.IMAGE_PREFIX }}/temporal-worker:sha-${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}/temporal-worker:prod-latest \
            --cache-from type=registry,ref=${{ env.IMAGE_PREFIX }}/server-buildcache:prod-temporal-worker \
            --cache-to type=registry,ref=${{ env.IMAGE_PREFIX }}/server-buildcache:prod-temporal-worker,mode=max \
            --push \
            build-prod-server/server/
          docker buildx build \
            -f build-prod-server/server/Dockerfile \
            --target migrate \
            -t ${{ env.IMAGE_PREFIX }}/server-migrate:${{ needs.version.outputs.server_tag }} \
            -t ${{ env.IMAGE_PREFIX }}/server-migrate:sha-${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}/server-migrate:prod-latest \
            --cache-from type=registry,ref=${{ env.IMAGE_PREFIX }}/server-buildcache:prod-migrate \
            --cache-to type=registry,ref=${{ env.IMAGE_PREFIX }}/server-buildcache:prod-migrate,mode=max \
            --push \
            build-prod-server/server/

  build-helpcenter:
    name: Build Help Center Image
    runs-on: arc-runners-helpin-ai
    needs: [version, changes]
    if: needs.changes.outputs.helpcenter == 'true' && needs.version.outputs.helpcenter_tag != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: build-prod-helpcenter

      - name: Prepare Docker socket
        run: |
          if [ -S /var/run/docker.sock ]; then
            sudo chmod 666 /var/run/docker.sock || true
          fi
          docker version

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push helpcenter image
        run: |
          docker buildx build \
            -f build-prod-helpcenter/help-center/Dockerfile \
            -t ${{ env.IMAGE_PREFIX }}/helpcenter:${{ needs.version.outputs.helpcenter_tag }} \
            -t ${{ env.IMAGE_PREFIX }}/helpcenter:sha-${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}/helpcenter:prod-latest \
            --push \
            build-prod-helpcenter/help-center/

  deploy-netlify:
    name: Build & Deploy Frontend to Netlify
    runs-on: arc-runners-helpin-ai
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: build-prod-netlify

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Doppler CLI
        run: curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sudo sh

      - name: Download secrets to .env
        run: |
          cd build-prod-netlify/frontend
          doppler secrets download -t ${{ secrets.DOPPLER_TOKEN_FRONTEND_PROD }} --format=env-no-quotes --no-file > .env

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install and build frontend
        run: |
          cd build-prod-netlify
          pnpm install --no-frozen-lockfile
          NODE_OPTIONS=--max-old-space-size=8192 pnpm \
            --filter @helpin-ai/sdk-js... \
            --filter @helpin-ai/widget-embed... \
            --filter @helpin-ai/react... \
            --filter @helpin-ai/nextjs... \
            --filter frontend... \
            build

      - name: Link Netlify site
        working-directory: build-prod-netlify
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_PROD }}
        run: |
          mkdir -p .netlify
          printf '{\"siteId\":\"%s\"}\n' "$NETLIFY_SITE_ID" > .netlify/state.json

      - name: Deploy to Netlify
        working-directory: build-prod-netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: pnpm --package=netlify-cli@24.2.0 dlx netlify deploy --filter frontend --dir frontend/dist --no-build --prod

  release:
    name: Create Official Release
    runs-on: arc-runners-helpin-ai
    needs: [version, changes, build-server, build-helpcenter]
    if: |
      always() &&
      needs.version.result == 'success' &&
      (needs.build-server.result == 'success' || needs.build-helpcenter.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          path: prod-release

      - name: Configure git
        working-directory: prod-release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push per-service release tags
        working-directory: prod-release
        run: |
          SERVER_TAG="${{ needs.version.outputs.server_tag }}"
          HELPCENTER_TAG="${{ needs.version.outputs.helpcenter_tag }}"

          for TAG in "$SERVER_TAG" "$HELPCENTER_TAG"; do
            if [ -n "$TAG" ]; then
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "$TAG"
              echo "Created tag: $TAG"
            fi
          done

      - name: Generate release notes
        working-directory: prod-release
        run: |
          SERVER_TAG="${{ needs.version.outputs.server_tag }}"
          HELPCENTER_TAG="${{ needs.version.outputs.helpcenter_tag }}"
          SERVER_PREV="${{ needs.version.outputs.server_prev }}"
          HELPCENTER_PREV="${{ needs.version.outputs.helpcenter_prev }}"

          TITLE_PARTS=""
          [ -n "$SERVER_TAG" ] && TITLE_PARTS="$SERVER_TAG"
          [ -n "$HELPCENTER_TAG" ] && TITLE_PARTS="${TITLE_PARTS:+$TITLE_PARTS, }$HELPCENTER_TAG"

          RELEASE_NAME=""
          [ -n "$SERVER_TAG" ] && RELEASE_NAME="$SERVER_TAG"
          [ -z "$RELEASE_NAME" ] && RELEASE_NAME="$HELPCENTER_TAG"

          # Use the oldest prev tag for commit log range
          PREV_TAG="$SERVER_PREV"
          [ -z "$PREV_TAG" ] && PREV_TAG="$HELPCENTER_PREV"

          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)")
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" -20)
          fi

          echo "<details>" >> release_notes.md
          echo "<summary>Commit Log</summary>" >> release_notes.md
          echo "" >> release_notes.md
          echo "$COMMITS" >> release_notes.md
          echo "" >> release_notes.md
          echo "</details>" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Images" >> release_notes.md
          if [ -n "$SERVER_TAG" ]; then
            echo "- \`${{ env.IMAGE_PREFIX }}/server:$SERVER_TAG\`" >> release_notes.md
            echo "- \`${{ env.IMAGE_PREFIX }}/temporal-worker:$SERVER_TAG\`" >> release_notes.md
            echo "- \`${{ env.IMAGE_PREFIX }}/server-migrate:$SERVER_TAG\`" >> release_notes.md
          fi
          [ -n "$HELPCENTER_TAG" ] && echo "- \`${{ env.IMAGE_PREFIX }}/helpcenter:$HELPCENTER_TAG\`" >> release_notes.md
          echo "" >> release_notes.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG:-HEAD~10}...$RELEASE_NAME" >> release_notes.md

          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"

      - name: Install GitHub CLI
        run: |
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          sudo mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y gh
          gh --version

      - name: Create GitHub release
        working-directory: prod-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_NAME" \
            --title "Release: $RELEASE_NAME" \
            --notes-file release_notes.md \
            --latest

      - name: Update K8s manifests
        working-directory: prod-release
        run: |
          SERVER_TAG="${{ needs.version.outputs.server_tag }}"
          HELPCENTER_TAG="${{ needs.version.outputs.helpcenter_tag }}"
          MANIFEST_DIR="k8s/prod"
          UPDATED=""

          if [ -n "$SERVER_TAG" ]; then
            SERVER_IMAGE="${{ env.IMAGE_PREFIX }}/server:${SERVER_TAG}"
            TEMPORAL_IMAGE="${{ env.IMAGE_PREFIX }}/temporal-worker:${SERVER_TAG}"
            MIGRATE_IMAGE="${{ env.IMAGE_PREFIX }}/server-migrate:${SERVER_TAG}"
            sed -i -E "s|ghcr\.io/helpin-ai/helpin/server:[^ \"]+|${SERVER_IMAGE}|g" "$MANIFEST_DIR/server.yaml"
            sed -i -E "s|ghcr\.io/helpin-ai/helpin/server:[^ \"]+|${SERVER_IMAGE}|g" "$MANIFEST_DIR/git-pr-status-reconciler.yaml"
            sed -i -E "s|ghcr\.io/helpin-ai/helpin/server:[^ \"]+|${MIGRATE_IMAGE}|g; s|ghcr\.io/helpin-ai/helpin/server-migrate:[^ \"]+|${MIGRATE_IMAGE}|g" "$MANIFEST_DIR/server-migrate.yaml"
            sed -i -E "s|ghcr\.io/helpin-ai/helpin/server:[^ \"]+|${TEMPORAL_IMAGE}|g; s|ghcr\.io/helpin-ai/helpin/temporal-worker:[^ \"]+|${TEMPORAL_IMAGE}|g" "$MANIFEST_DIR/temporal-worker.yaml"
            UPDATED="${UPDATED:+$UPDATED, }server-family→$SERVER_TAG"
          fi

          if [ -n "$HELPCENTER_TAG" ]; then
            HELPCENTER_IMAGE="${{ env.IMAGE_PREFIX }}/helpcenter:${HELPCENTER_TAG}"
            find "$MANIFEST_DIR" -name "*.yaml" -exec \
              sed -i -E "s|ghcr\.io/helpin-ai/helpin/helpcenter:[^ \"]+|${HELPCENTER_IMAGE}|g" {} +
            UPDATED="${UPDATED:+$UPDATED, }helpcenter→$HELPCENTER_TAG"
          fi

          git add k8s/
          git commit -m "chore: update prod images ($UPDATED) [skip ci]" || echo "No manifest changes"

      - name: Push all changes
        working-directory: prod-release
        run: |
          git pull --rebase origin main
          git push origin main

      - name: Clean up RC tags
        working-directory: prod-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SERVER_TAG="${{ needs.version.outputs.server_tag }}"
          HELPCENTER_TAG="${{ needs.version.outputs.helpcenter_tag }}"

          for TAG in "$SERVER_TAG" "$HELPCENTER_TAG"; do
            if [ -n "$TAG" ]; then
              RC_TAGS=$(git tag -l "${TAG}-rc.*" "${TAG}-dev.*" 2>/dev/null || echo "")
              for rc in $RC_TAGS; do
                echo "Cleaning up: $rc"
                gh release delete "$rc" --yes 2>/dev/null || true
                git push origin --delete "$rc" 2>/dev/null || true
              done
            fi
          done
