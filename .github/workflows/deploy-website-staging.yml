# Deploy Website (Staging) to Cloudflare Pages
# Cloudflare Pages project:
#   - helpin-website-stage (staging): stage.helpin.ai
# Required GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy Website to Cloudflare Pages (Staging)

on:
  push:
    branches: [develop]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website-staging.yml"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Run regardless of changed paths"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: website-deploy-staging-${{ github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Website (staging)
    runs-on: arc-runners-helpin-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: website

      - name: Build website
        run: pnpm build
        working-directory: website

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist-stage
          path: website/out

  deploy-staging:
    name: Deploy to Staging (stage.helpin.ai)
    runs-on: arc-runners-helpin-ai
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website-dist-stage
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure Cloudflare Pages project exists
        run: npx wrangler@3.114.1 pages project create helpin-website-stage --production-branch=develop 2>/dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.1'
          command: pages deploy dist --project-name=helpin-website-stage --branch=develop
