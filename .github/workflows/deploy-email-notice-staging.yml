# Deploy Email Notice Page (Staging) to Cloudflare Pages
# Cloudflare Pages project:
#   - helpin-email-notice-stage (staging): helpin-email-notice-stage.pages.dev (no custom domain)
# Required GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy Email Notice to Cloudflare Pages (Staging)

on:
  push:
    branches: [develop]
    paths:
      - ".node-version"
      - "apps/email-notice/**"
      - ".github/workflows/deploy-email-notice-staging.yml"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Run regardless of changed paths"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: email-notice-deploy-staging-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy to Staging (helpin-email-notice-stage.pages.dev)
    runs-on: arc-runners-helpin-ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - name: Ensure Cloudflare Pages project exists
        run: npx --yes wrangler@3.114.1 pages project create helpin-email-notice-stage --production-branch=develop 2>/dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The static page needs no workspace install. Wrangler's action would run
      # pnpm add at the monorepo root, which pnpm rejects.
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@3.114.1 pages deploy apps/email-notice/public --project-name=helpin-email-notice-stage --branch=develop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
