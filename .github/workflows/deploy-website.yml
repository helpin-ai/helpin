# Deploy Website to Cloudflare Pages
# Cloudflare Pages projects:
#   - helpin-website (production): helpin.ai
# Required GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy Website to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - ".node-version"
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Run regardless of changed paths"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: website-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: website

      - name: Build website
        run: pnpm build
        working-directory: website

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-dist
          # Pages Functions (e.g. the /docs reverse proxy) deploy alongside the static export.
          path: |
            website/out
            website/functions

  deploy-production:
    name: Deploy to Production (helpin.ai)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website-dist
          path: site

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: "24.21.0"

      - name: Ensure Cloudflare Pages project exists
        run: npx wrangler@3.114.1 pages project create helpin-website --production-branch=main 2>/dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.1'
          # Wrangler picks up ./functions from the working directory.
          workingDirectory: site
          command: pages deploy out --project-name=helpin-website --branch=main
