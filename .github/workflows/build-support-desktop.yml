name: Build Support Desktop Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/build-support-desktop.yml"
      - "apps/support-desktop/**"
      - "packages/support-core/**"
      - "packages/widget-core/**"
      - "packages/shared/**"
      - "frontend/src/components/support/**"
      - "frontend/src/hooks/queries/useSupport.ts"
      - "frontend/src/lib/supportInboxFilters.ts"
      - "frontend/src/stores/supportInboxStore.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: support-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_EDITION: ee
  VITE_API_URL: ${{ vars.SUPPORT_DESKTOP_API_URL || 'https://api.helpin.ai/api' }}
  VITE_WEB_BASE_URL: ${{ vars.SUPPORT_DESKTOP_WEB_BASE_URL || 'https://app.helpin.ai' }}

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS-arm64
            artifact: helpin-support-macos-arm64
          - os: windows-latest
            label: Windows-x64
            artifact: helpin-support-windows-x64
          - os: ubuntu-24.04
            label: Linux-x64
            artifact: helpin-support-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: "22"
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/support-desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared desktop dependencies
        run: pnpm --filter @helpin-ai/widget-core build

      - name: Verify desktop frontend
        run: pnpm --dir apps/support-desktop run build

      - name: Build native desktop bundles
        env:
          # Internal macOS test builds use an ad-hoc identity. Production
          # distribution will replace this with Developer ID + notarization.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: pnpm --dir apps/support-desktop run tauri:build

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}-${{ github.run_number }}
          path: |
            apps/support-desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/support-desktop/src-tauri/target/release/bundle/**/*.msi
            apps/support-desktop/src-tauri/target/release/bundle/**/*-setup.exe
            apps/support-desktop/src-tauri/target/release/bundle/**/*.deb
            apps/support-desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/support-desktop/src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
