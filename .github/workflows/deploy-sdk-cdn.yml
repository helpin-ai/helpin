# Deploy SDK to Cloudflare Pages
# Cloudflare Pages projects:
#   - helpin-cdn-js (production): cdn.helpin.ai
#   - helpin-cdn-stage-js (staging): cdn-stage.helpin.ai
# Required GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy SDK to Cloudflare Pages

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/sdk-js/**"
      - "packages/widget-core/**"
      - "packages/shared/**"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Run regardless of changed paths"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sdk-cdn-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SDK
    runs-on: arc-runners-helpin-ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: '22'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK (shared → widget-core → sdk-js)
        run: pnpm build --filter @helpin-ai/sdk-js...

      - name: Prepare CDN deploy directory
        run: |
          mkdir -p packages/sdk-js/cdn-deploy
          cp packages/sdk-js/dist/lib.js packages/sdk-js/cdn-deploy/lib.js
          cp packages/sdk-js/dist/helpin.*.js packages/sdk-js/cdn-deploy/ 2>/dev/null || true
          cp packages/sdk-js/dist/helpin.*.css packages/sdk-js/cdn-deploy/ 2>/dev/null || true
          cp -r packages/sdk-js/dist/chunks packages/sdk-js/cdn-deploy/ 2>/dev/null || true
          cp packages/sdk-js/dist-cdn/index.html packages/sdk-js/cdn-deploy/index.html
          cp -r packages/sdk-js/public/* packages/sdk-js/cdn-deploy/

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-dist
          path: packages/sdk-js/cdn-deploy

  deploy-staging:
    name: Deploy to Staging (cdn-stage.helpin.ai)
    runs-on: arc-runners-helpin-ai
    needs: build
    if: github.ref_name == 'develop'
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-dist
          path: dist

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3.114.1 pages project create helpin-cdn-stage-js --production-branch=staging 2>/dev/null || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.1'
          command: pages deploy dist --project-name=helpin-cdn-stage-js --branch=staging

  deploy-production:
    name: Deploy to Production (cdn.helpin.ai)
    runs-on: arc-runners-helpin-ai
    needs: build
    if: github.ref_name == 'main'
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-dist
          path: dist

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3.114.1 pages project create helpin-cdn-js --production-branch=main 2>/dev/null || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.1'
          command: pages deploy dist --project-name=helpin-cdn-js
