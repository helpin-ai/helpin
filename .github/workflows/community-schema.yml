name: Community schema parity
on:
  pull_request:
    branches: [main, develop]
    paths: ['server/**', '.github/workflows/community-schema.yml']
  push:
    branches: [main, develop]
    paths: ['server/**', '.github/workflows/community-schema.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-ledger-matches-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_PASSWORD: community-test-only
          POSTGRES_DB: schema_parity
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d schema_parity'
          --health-interval 5s --health-retries 20
    env:
      GOWORK: off
      COMMUNITY_TEST_DATABASE_URL: postgres://postgres:community-test-only@localhost:5432/schema_parity?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Provision required extensions
        run: psql "$COMMUNITY_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector; CREATE EXTENSION pgcrypto;'
      - name: Compare fresh ledger with the API startup model list
        working-directory: server
        run: go test -tags integration ./internal/dbmigrate -run '^TestFreshCommunityFoundationPostgres$' -count=1 -v
