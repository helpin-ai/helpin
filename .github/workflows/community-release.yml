name: Community release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Distinct Community beta tag (community-v0.1.0-rc.1)
        required: true
        type: string
      publication_review_complete:
        description: License/EE/history review and real DNS/TLS RC journey are approved
        type: boolean
        required: true
        default: false
      public_host_evidence:
        description: HTTPS link to the reviewed external-host acceptance record
        type: string
        required: true
      upgrade_from:
        description: Comma-separated source release tags tested for full-stack upgrade and recovery (optional)
        type: string
        default: ''
      upgrade_evidence:
        description: HTTPS record of full-stack upgrade and recovery for those source tags
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: community-publication
  cancel-in-progress: false
jobs:
  approved:
    environment: community-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate publication prerequisites
        env:
          TAG: ${{ inputs.tag }}
          APPROVED: ${{ inputs.publication_review_complete }}
          EVIDENCE: ${{ inputs.public_host_evidence }}
        run: |
          [[ "$APPROVED" == true ]]
          [[ "$TAG" =~ ^community-v0\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$ ]]
          [[ "$EVIDENCE" == https://* ]]
          test -s LICENSE
      - name: Refuse an existing release or tag before building images
        env:
          GH_TOKEN: ${{ github.token }}
          COMMUNITY_RELEASE_TAG: ${{ inputs.tag }}
        run: python3 community/promote-release.py check
  cli:
    needs: approved
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Test and build operator CLI
        env:
          COMMUNITY_RELEASE_TAG: ${{ inputs.tag }}
          GOWORK: off
        run: |
          (cd community/cli && go test -race ./...)
          python3 -m unittest discover -s community/tests -p 'bootstrap_test.py'
          docker pull alpine:3.20
          python3 community/cli/acceptance.py
          python3 community/build-cli.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: community-cli
          path: release-artifacts/
          if-no-files-found: error
  native:
    needs: approved
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    uses: ./.github/workflows/community-test.yml
    with:
      level: full
      architecture: ${{ matrix.arch }}
      export-images: true
    secrets:
      runtime_read_token: ${{ secrets.COMMUNITY_RUNTIME_READ_TOKEN }}
  push:
    needs: native
    environment: community-release
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      COMMUNITY_RELEASE_TAG: ${{ inputs.tag }}
      COMMUNITY_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: community-tested-${{ matrix.arch }}
          path: community/release-artifacts
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested archive without rebuilding
        run: community/release-images.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: community-release-${{ matrix.arch }}
          path: |
            community/release-artifacts/images-*.txt
            community/release-artifacts/*.cdx.json
            community/release-artifacts/source-*.txt
            community/release-artifacts/runtime-*.txt
  bundle:
    needs: [push, cli]
    runs-on: ubuntu-24.04
    environment: community-release
    permissions:
      contents: read
      packages: write
    env:
      COMMUNITY_RELEASE_TAG: ${{ inputs.tag }}
      PUBLIC_HOST_EVIDENCE: ${{ inputs.public_host_evidence }}
      COMMUNITY_UPGRADE_FROM: ${{ inputs.upgrade_from }}
      UPGRADE_EVIDENCE: ${{ inputs.upgrade_evidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: community-release-*
          path: release-artifacts
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: community-cli
          path: release-artifacts
      - name: Assemble tested manifests and digest-pinned bundle
        run: python3 community/package-release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: community-bundle
          path: |
            release-artifacts/helpin-community-*.tar.gz*
            release-artifacts/release.json
            release-artifacts/helpin-linux-*
            release-artifacts/helpin-darwin-*
            release-artifacts/install.sh*
          if-no-files-found: error
          retention-days: 30
