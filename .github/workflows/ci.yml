name: CI

# Required source/edition checks and dependency-aware selection. Full Community
# image acceptance runs separately on schedules, manual dispatch and releases.

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel in-progress runs for the same PR/branch when a new push lands.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'arc-runners-helpin-ai' }}
    outputs:
      server: ${{ steps.filter.outputs.server }}
      frontend: ${{ steps.filter.outputs.frontend }}
      admin: ${{ steps.filter.outputs.admin }}
      packages: ${{ steps.filter.outputs.packages }}
      helpcenter: ${{ steps.filter.outputs.helpcenter }}
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile: ${{ steps.filter.outputs.mobile }}
      eventpipeline: ${{ steps.filter.outputs.eventpipeline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 scripts/ci/checks.py changes --all </dev/null
          else
            git diff --name-only "$BASE_SHA...$HEAD_SHA" | python3 scripts/ci/checks.py changes
          fi

  workflow-checks:
    name: Workflow validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - name: Check documentation names and links
        run: |
          python3 -m unittest discover -s scripts/docs -p '*_test.py'
          python3 scripts/docs/check_names.py
          python3 scripts/docs/check_links.py
      - name: Check for committed secrets
        run: python3 scripts/ci/check_secrets.py
      - name: Validate CI policy and workflows
        run: |
          python3 -m unittest discover -s scripts/ci -p '*_test.py'
          python3 -m unittest discover -s community/tests -p '*_test.py'
          node --test community/tests/installer.test.mjs
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -shellcheck= .github/workflows/*.yml
          shellcheck -S error community/*.sh community/postgres/*.sh community/tests/*.sh scripts/check-community-*.sh scripts/ci/*.sh

  schema:
    name: fresh-ledger-matches-api
    needs: [changes, workflow-checks]
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/postgres-check.yml
    with:
      suite: schema

  # --------------------- Events Pipeline --------------------
  eventpipeline:
    name: Events Pipeline CI
    needs: [changes, workflow-checks]
    if: needs.changes.outputs.eventpipeline == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'arc-runners-helpin-ai' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust native build dependencies
        run: |
          if command -v cc >/dev/null 2>&1 \
            && command -v pkg-config >/dev/null 2>&1 \
            && pkg-config --exists openssl; then
            exit 0
          fi

          PACKAGES="build-essential pkg-config libssl-dev"
          (command -v sudo >/dev/null 2>&1 && sudo apt-get update && sudo apt-get install -y $PACKAGES) \
            || (apt-get update && apt-get install -y $PACKAGES) \
            || { echo "::error::could not install Rust native build dependencies"; exit 1; }

          cc --version
          pkg-config --modversion openssl
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0
      - name: Test capture, replay, bootstrap, and writer binaries
        working-directory: events-pipeline/rust-capture
        run: cargo test --locked

  # ------------------------- Server -------------------------
  server:
    name: Server CI
    needs: [changes, workflow-checks]
    if: needs.changes.outputs.server == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'arc-runners-helpin-ai' }}
    # Plan budget: ≤ 6 min for vet+build. Generous timeout so transient
    # network blips don't fail the run for the wrong reason.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Task is canonical
        run: bash scripts/check-task-canonical.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: server/go.sum

      - name: Vet
        working-directory: server
        run: |
          go vet ./...
          go vet -tags ee ./...

      - name: Build
        working-directory: server
        run: |
          go build ./cmd/clickhouse-migrate
          go build -tags ee ./cmd/api ./cmd/temporal-worker ./cmd/migrate

  community-backend:
    name: Community without EE source
    needs: [changes, workflow-checks]
    if: needs.changes.outputs.server == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'arc-runners-helpin-ai' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: server/go.sum
      - name: Install CGO test dependencies
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends build-essential
            else
              apt-get update
              apt-get install -y --no-install-recommends build-essential
            fi
          fi
          gcc --version
      - name: Build and test community distribution
        run: bash scripts/check-community-backend.sh

  ai-profile-postgres:
    name: AI profile migration PostgreSQL regression
    needs: [changes, workflow-checks]
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/postgres-check.yml
    with:
      suite: migrations

  server-tests:
    name: Server Tests
    needs: [changes, workflow-checks]
    if: needs.changes.outputs.server == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'arc-runners-helpin-ai' }}
    timeout-minutes: 20
    # Existing test suite uses in-memory SQLite (see server/CLAUDE.md).
    # `services: postgres` is aspirational and currently breaks on our
    # ARC runners (k8s API unreachable when spinning up the sidecar pod).
    # Postgres-backed tests will move to nightly with a setup-postgres
    # action once the runner story is sorted.
    env:
      # mattn/go-sqlite3 (used by gorm.io/driver/sqlite) requires CGO.
      # Without this, database/tool tests fail with "Binary was compiled
      # with 'CGO_ENABLED=0'". The runner image must have gcc installed.
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: server/go.sum
      - name: Verify gcc available (CGO requires it)
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            echo "::warning::gcc not found; installing build-essential"
            (command -v sudo >/dev/null 2>&1 && sudo apt-get update && sudo apt-get install -y gcc) \
              || (apt-get update && apt-get install -y gcc) \
              || echo "::error::could not install gcc — CGO tests will fail"
          fi
          gcc --version || true
      - name: Test
        working-directory: server
        run: go test -tags ee ./...

  # ------------------------ Frontend ------------------------
  frontend:
    name: Frontend CI
    needs: [changes, workflow-checks]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'arc-runners-helpin-ai' }}
    # Compile both editions, including cold TypeScript caches.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: |
          pnpm --dir frontend run build:ee

  frontend-tests:
    name: Frontend Vitest
    needs: [changes, workflow-checks]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'arc-runners-helpin-ai' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build widget-core (frontend imports compiled output)
        run: pnpm --filter @helpin-ai/widget-core build
      - name: Frontend Vitest
        run: pnpm --dir frontend run test:ee

  community-frontend:
    name: Community frontend without EE source
    needs: [changes, workflow-checks]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'arc-runners-helpin-ai' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared widget code
        run: pnpm --filter @helpin-ai/widget-core build
      - name: Build and test community distribution
        run: bash scripts/check-community-frontend.sh

  # ------------------------ Packages ------------------------
  packages-tests:
    name: Package Vitest
    needs: [changes, workflow-checks]
    if: needs.changes.outputs.packages == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'arc-runners-helpin-ai' }}
    # Plan budget: ≤ 3 min for all packages combined.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # widget-core's reply-time-parity.test imports from @helpin-ai/shared;
      # without dist/ built, vite can't resolve the package entry. Build
      # workspace deps first so all package tests find their imports.
      - name: Build workspace deps (shared)
        run: pnpm --filter @helpin-ai/shared build
      - name: widget-core
        run: pnpm --dir packages/widget-core run test
      - name: sdk-js
        run: pnpm --dir packages/sdk-js run test
      - name: react
        run: pnpm --dir packages/react run test
      - name: nextjs
        run: pnpm --dir packages/nextjs run test
      - name: vue
        run: pnpm --dir packages/vue run test

  widget-upload-tests:
    name: Widget upload browser regressions
    needs: [changes, workflow-checks]
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/sdk-js exec playwright install --with-deps chromium firefox
      - run: pnpm --dir packages/sdk-js run test:e2e:uploads
      - name: Test smoke verification and cleanup
        run: node --test ops/widget-smoke/smoke.test.cjs
      - name: Verify smoke ConfigMap generates
        # deploy-prod.yml writes the generated ConfigMap to helpin-ai/gitops.
        run: python3 scripts/monitoring/generate-smoke-manifest.py > /dev/null

  # ----------------------- Help Center ----------------------
  helpcenter:
    name: Help Center CI
    needs: [changes, workflow-checks]
    if: needs.changes.outputs.helpcenter == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'arc-runners-helpin-ai' }}
    # Plan budget: ≤ 3 min build + test.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Install Node before pnpm; pnpm owns its cache after installation.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install
        working-directory: help-center
        run: pnpm install --frozen-lockfile
      - name: Verify generated icon catalog
        working-directory: help-center
        run: pnpm run check:icons
      - name: Vitest
        working-directory: help-center
        run: pnpm run test
      - name: Build
        working-directory: help-center
        run: pnpm run build

  # -------------------------- Admin -------------------------
  admin:
    name: Admin CI
    needs: [changes, workflow-checks]
    if: needs.changes.outputs.admin == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'arc-runners-helpin-ai' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build admin
        run: pnpm --dir apps/admin run build

  # ------------------- Support Desktop (Tauri) --------------
  # The desktop app reuses frontend/src via the `@` alias, so a web change can
  # break it. This gate runs its `tsc -b && vite build` in the same PR that
  # changes web/packages, surfacing breakage at the source instead of at the
  # next branch sync. (Validates the JS bundle only; the native Tauri build is
  # separate.)
  desktop:
    name: Support Desktop CI
    needs: [changes, workflow-checks]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'arc-runners-helpin-ai' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # widget-core is resolved from its compiled dist for type-checking; build
      # it (turbo pulls in @helpin-ai/shared via ^build) before the desktop build.
      - name: Build workspace deps (widget-core, shared)
        run: pnpm --filter @helpin-ai/widget-core build
      - name: Build support-desktop (tsc -b && vite build)
        run: pnpm --dir apps/support-desktop run build

  # ------------------- Support Mobile (Tauri) ---------------
  # Validates the web/TS side of the mobile shell (typecheck + vitest for
  # both the app and packages/support-core, which it consumes from source
  # via a Vite/tsconfig alias — see apps/support-mobile/vite.config.ts — so
  # no package build step is needed before those run, unlike the desktop
  # job's widget-core dependency), PLUS a `cargo check` of `src-tauri/`.
  #
  # The cargo check compiles the DESKTOP (linux host) target only — the
  # mobile shell and the vendored tauri-plugin-helpin-push were written
  # without a local Rust toolchain, so this is their only compile gate.
  # Android/iOS targets need SDK/NDK/Xcode setups and stay release-pipeline
  # scope, not per-PR scope. The webkit2gtk/gtk apt packages below are
  # tauri v2's Linux build prerequisites (sys crates resolve them via
  # pkg-config at build time), per https://v2.tauri.app/start/prerequisites/.
  mobile-check:
    name: Support Mobile CI
    needs: [changes, workflow-checks]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'arc-runners-helpin-ai' }}
    # cargo check of the tauri stack is heavy on a cold cache (rust-cache
    # keeps warm runs fast); generous timeout so a cache miss doesn't fail
    # the run for the wrong reason.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck support-mobile
        run: pnpm --dir apps/support-mobile run typecheck
      - name: Test support-mobile
        run: pnpm --dir apps/support-mobile run test
      - name: Test support-core
        run: pnpm --dir packages/support-core run test
      - name: Install Tauri Linux build deps (webkit2gtk/gtk via pkg-config)
        # Same sudo-or-not fallback pattern as server-tests' gcc step — ARC
        # runner images may or may not ship sudo.
        run: |
          PKGS="pkg-config build-essential libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev"
          (command -v sudo >/dev/null 2>&1 && sudo apt-get update && sudo apt-get install -y $PKGS) \
            || (apt-get update && apt-get install -y $PKGS) \
            || echo "::error::could not install Tauri Linux build deps — cargo check will fail"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/support-mobile/src-tauri
      - name: Build frontend dist (tauri::generate_context! embeds frontendDist)
        # The generate_context! proc macro reads tauri.conf.json and embeds
        # the frontendDist ("../dist") assets at compile time, so ../dist
        # must exist before cargo check expands it. cargo check itself never
        # invokes tauri-cli, so beforeBuildCommand does not run here.
        run: pnpm --dir apps/support-mobile run build
      - name: Cargo check (desktop target — see job comment)
        run: cargo check --manifest-path apps/support-mobile/src-tauri/Cargo.toml

  required:
    name: CI required
    if: always()
    needs: [changes, workflow-checks, server, server-tests, community-backend, ai-profile-postgres, schema, frontend, frontend-tests, community-frontend, admin, packages-tests, helpcenter, desktop, mobile-check, eventpipeline]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected check
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/checks.py required
