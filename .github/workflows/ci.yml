name: CI

on:
  # Paused temporarily. Run manually from the Actions UI if needed.
  workflow_dispatch:
  # pull_request:
  #   branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  server:
    name: Server CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Vet
        working-directory: server
        run: go vet ./...
      - name: Build
        working-directory: server
        run: |
          go build ./cmd/api
          go build ./cmd/temporal-worker

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm build

  helpcenter:
    name: Help Center CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: help-center/pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
      - name: Install
        working-directory: help-center
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: help-center
        run: pnpm run build
