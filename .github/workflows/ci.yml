name: CI

on:
  # Keep CI manual-only for now. The frontend support e2e suite is wired,
  # but we are not gating PRs on it yet.
  workflow_dispatch:
  # pull_request:
  #   branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  server:
    name: Server CI
    runs-on: arc-runners-helpin-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Vet
        working-directory: server
        run: go vet ./...
      - name: Build
        working-directory: server
        run: |
          go build ./cmd/api
          go build ./cmd/temporal-worker

  frontend:
    name: Frontend CI
    runs-on: arc-runners-helpin-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Enable when we are ready to gate PRs on frontend browser coverage.
      # - name: Install Playwright Chromium
      #   run: pnpm --dir frontend exec playwright install --with-deps chromium
      # - name: Frontend support e2e
      #   run: pnpm --dir frontend run test:e2e:support
      - name: Build all packages
        run: pnpm build

  helpcenter:
    name: Help Center CI
    runs-on: arc-runners-helpin-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: help-center/pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
      - name: Install
        working-directory: help-center
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: help-center
        run: pnpm run build
