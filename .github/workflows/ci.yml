name: CI

# PR-required CI gates. Mirrors the rollout in
# `docs/test-suite-ci-email-plan.md`. Suites that haven't met the promotion
# criteria (5 consecutive green nightlies + flake rate < 2% + p95 within
# budget) run as `continue-on-error: true` so they're visible without
# blocking PRs. Promoting one to required is a single-line edit.

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # Cancel in-progress runs for the same PR/branch when a new push lands.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect Changes
    runs-on: arc-runners-helpin-ai
    outputs:
      server: ${{ steps.filter.outputs.server }}
      frontend: ${{ steps.filter.outputs.frontend }}
      admin: ${{ steps.filter.outputs.admin }}
      packages: ${{ steps.filter.outputs.packages }}
      helpcenter: ${{ steps.filter.outputs.helpcenter }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "admin=true" >> "$GITHUB_OUTPUT"
            echo "packages=true" >> "$GITHUB_OUTPUT"
            echo "helpcenter=true" >> "$GITHUB_OUTPUT"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          fi

          echo "Changed files:"
          echo "$CHANGED"

          SERVER=false
          FRONTEND=false
          ADMIN=false
          PACKAGES=false
          HELPCENTER=false
          DESKTOP=false

          if echo "$CHANGED" | grep -qE '^server/|^\.github/workflows/ci\.yml$'; then
            SERVER=true
          fi
          if echo "$CHANGED" | grep -qE '^frontend/|^packages/(shared|widget-core)/|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json)$|^\.github/workflows/ci\.yml$'; then
            FRONTEND=true
          fi
          if echo "$CHANGED" | grep -qE '^apps/admin/|^frontend/src/index\.css$|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json)$|^\.github/workflows/ci\.yml$'; then
            ADMIN=true
          fi
          if echo "$CHANGED" | grep -qE '^packages/|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json)$|^\.github/workflows/ci\.yml$'; then
            PACKAGES=true
          fi
          if echo "$CHANGED" | grep -qE '^help-center/|^packages/shared/src/docs-blocks\.css$|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$|^\.github/workflows/ci\.yml$'; then
            HELPCENTER=true
          fi
          # Desktop reuses frontend/src via the `@` alias and depends on the
          # workspace packages, so web/package changes can break it — gate on all
          # of those, the desktop app itself, and root/workspace config.
          if echo "$CHANGED" | grep -qE '^apps/support-desktop/|^frontend/|^packages/|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json)$|^\.github/workflows/ci\.yml$'; then
            DESKTOP=true
          fi

          echo "server=$SERVER" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "helpcenter=$HELPCENTER" >> "$GITHUB_OUTPUT"
          echo "desktop=$DESKTOP" >> "$GITHUB_OUTPUT"
          echo "Detected: server=$SERVER frontend=$FRONTEND admin=$ADMIN packages=$PACKAGES helpcenter=$HELPCENTER desktop=$DESKTOP"

  # ------------------------- Server -------------------------
  server:
    name: Server CI
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: arc-runners-helpin-ai
    # Plan budget: ≤ 6 min for vet+build. Generous timeout so transient
    # network blips don't fail the run for the wrong reason.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Migration status (informational)
        # `migrate validate` exits 1 on pending migrations, which is normal
        # for any PR that adds one — so we print status only here. A real
        # PR-safe lint will land in a follow-up `cmd/migrate lint`.
        working-directory: server
        run: go run ./cmd/migrate status || true

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Build
        working-directory: server
        run: |
          go build ./cmd/api
          go build ./cmd/temporal-worker
          go build ./cmd/migrate

  server-tests:
    name: Server Tests
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: arc-runners-helpin-ai
    timeout-minutes: 20
    # Informational until promoted per the plan's promotion criteria.
    continue-on-error: true
    # Existing test suite uses in-memory SQLite (see server/CLAUDE.md).
    # `services: postgres` is aspirational and currently breaks on our
    # ARC runners (k8s API unreachable when spinning up the sidecar pod).
    # Postgres-backed tests will move to nightly with a setup-postgres
    # action once the runner story is sorted.
    env:
      # mattn/go-sqlite3 (used by gorm.io/driver/sqlite) requires CGO.
      # Without this, codex/auth/tool tests fail with "Binary was compiled
      # with 'CGO_ENABLED=0'". The runner image must have gcc installed.
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Verify gcc available (CGO requires it)
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            echo "::warning::gcc not found; installing build-essential"
            (command -v sudo >/dev/null 2>&1 && sudo apt-get update && sudo apt-get install -y gcc) \
              || (apt-get update && apt-get install -y gcc) \
              || echo "::error::could not install gcc — CGO tests will fail"
          fi
          gcc --version || true
      - name: Test
        working-directory: server
        run: go test ./...

  # ------------------------ Frontend ------------------------
  frontend:
    name: Frontend CI
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: arc-runners-helpin-ai
    # Plan budget: ≤ 4 min build. Tsc -b alone can stretch to 3-4m on
    # cold cache; allow headroom.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm --dir frontend run build

  frontend-tests:
    name: Frontend Vitest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: arc-runners-helpin-ai
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build widget-core (frontend imports compiled output)
        run: pnpm --filter @helpin-ai/widget-core build
      - name: Frontend Vitest
        run: pnpm --dir frontend run test

  # ------------------------ Packages ------------------------
  packages-tests:
    name: Package Vitest
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: arc-runners-helpin-ai
    # Plan budget: ≤ 3 min for all packages combined.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # widget-core's reply-time-parity.test imports from @helpin-ai/shared;
      # without dist/ built, vite can't resolve the package entry. Build
      # workspace deps first so all package tests find their imports.
      - name: Build workspace deps (shared)
        run: pnpm --filter @helpin-ai/shared build
      - name: widget-core
        run: pnpm --dir packages/widget-core run test
      - name: sdk-js
        run: pnpm --dir packages/sdk-js run test
      - name: react
        run: pnpm --dir packages/react run test
      - name: nextjs
        run: pnpm --dir packages/nextjs run test
      - name: vue
        run: pnpm --dir packages/vue run test

  # ----------------------- Help Center ----------------------
  helpcenter:
    name: Help Center CI
    needs: changes
    if: needs.changes.outputs.helpcenter == 'true'
    runs-on: arc-runners-helpin-ai
    # Plan budget: ≤ 3 min build + test.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      # pnpm must be installed BEFORE setup-node when setup-node uses
      # `cache: pnpm` — otherwise setup-node can't find pnpm on PATH.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: help-center/pnpm-lock.yaml
      - name: Install
        working-directory: help-center
        run: pnpm install --frozen-lockfile
      - name: Verify generated icon catalog
        working-directory: help-center
        run: pnpm run check:icons
      - name: Vitest
        working-directory: help-center
        run: pnpm run test
      - name: Build
        working-directory: help-center
        run: pnpm run build

  # -------------------------- Admin -------------------------
  admin:
    name: Admin CI
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: arc-runners-helpin-ai
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build admin
        run: pnpm --dir apps/admin run build

  # ------------------- Support Desktop (Tauri) --------------
  # The desktop app reuses frontend/src via the `@` alias, so a web change can
  # break it. This gate runs its `tsc -b && vite build` in the same PR that
  # changes web/packages, surfacing breakage at the source instead of at the
  # next branch sync. (Validates the JS bundle only; the native Tauri build is
  # separate.)
  desktop:
    name: Support Desktop CI
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: arc-runners-helpin-ai
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # widget-core is resolved from its compiled dist for type-checking; build
      # it (turbo pulls in @helpin-ai/shared via ^build) before the desktop build.
      - name: Build workspace deps (widget-core, shared)
        run: pnpm --filter @helpin-ai/widget-core build
      - name: Build support-desktop (tsc -b && vite build)
        run: pnpm --dir apps/support-desktop run build
