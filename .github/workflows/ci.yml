name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  server:
    name: Server CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Vet
        working-directory: server
        run: go vet ./...
      - name: Build
        working-directory: server
        run: go build ./cmd/api

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install and build packages
        run: pnpm install --no-frozen-lockfile && pnpm build
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  helpcenter:
    name: Help Center CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: help-center/package-lock.json
      - name: Install
        working-directory: help-center
        run: npm ci
      - name: Build
        working-directory: help-center
        run: npm run build
