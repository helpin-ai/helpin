name: Events Pipeline - Production

on:
  push:
    branches: [main]
    paths:
      - 'events-pipeline/**'
      - '.github/workflows/eventpipeline-*'
  workflow_dispatch:
    inputs:
      force_all:
        description: "Run regardless of changed paths"
        type: boolean
        default: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  RUST_IMAGE: ghcr.io/helpin-ai/helpin/events-pipeline

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Determine version
        id: version
        run: |
          LATEST_TAG=$(git tag -l "ep-v*" --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            VERSION="0.1.0"
          else
            VERSION=$(echo "$LATEST_TAG" | sed 's/ep-v//')
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3 | cut -d- -f1)
            PATCH=$((PATCH + 1))
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=ep-v$VERSION" >> "$GITHUB_OUTPUT"

  build-rust:
    permissions:
      contents: read
      packages: write
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Docker socket
        run: |
          if [ -S /var/run/docker.sock ]; then
            sudo chmod 666 /var/run/docker.sock || true
          fi
          docker version
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push Rust capture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: events-pipeline/rust-capture
          push: true
          tags: |
            ${{ env.RUST_IMAGE }}:prod-latest
            ${{ env.RUST_IMAGE }}:${{ needs.version.outputs.tag }}
          # Registry cache keeps these layers out of the 10 GB Actions cache.
          # Staging builds the same Dockerfile, so its cache seeds production.
          cache-from: |
            type=registry,ref=${{ env.RUST_IMAGE }}-buildcache:prod
            type=registry,ref=${{ env.RUST_IMAGE }}-buildcache:stage
          cache-to: type=registry,ref=${{ env.RUST_IMAGE }}-buildcache:prod,mode=max

  release:
    permissions:
      contents: write
    needs: [version, build-rust]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Create git tag
        run: |
          git tag ${{ needs.version.outputs.tag }}
          git push origin ${{ needs.version.outputs.tag }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "Release: Events Pipeline ${{ needs.version.outputs.version }}"
          generate_release_notes: true
      - name: Checkout gitops manifests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: helpin-ai/gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Update K8s manifests
        run: |
          DIR=gitops/helpin/prod/events-pipeline/deployments
          sed -i "s|${{ env.RUST_IMAGE }}:[^ ]*|${{ env.RUST_IMAGE }}:${{ needs.version.outputs.tag }}|g" "$DIR/eventpipeline-web.yaml"
          sed -i "s|${{ env.RUST_IMAGE }}:[^ ]*|${{ env.RUST_IMAGE }}:${{ needs.version.outputs.tag }}|g" "$DIR/eventpipeline-writer.yaml"
          bash scripts/ci/push-gitops.sh gitops \
            "chore: update helpin events-pipeline prod images to ${{ needs.version.outputs.tag }}" \
            helpin/prod/events-pipeline
