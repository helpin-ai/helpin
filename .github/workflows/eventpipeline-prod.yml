name: Events Pipeline - Production

on:
  push:
    branches: [main]
    paths:
      - 'events-pipeline/**'
      - '.github/workflows/eventpipeline-*'
  workflow_dispatch:
    inputs:
      force_all:
        description: "Run regardless of changed paths"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  RUST_IMAGE: ghcr.io/helpin-ai/helpin/events-pipeline

jobs:
  version:
    runs-on: arc-runners-helpin-ai
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version
        id: version
        run: |
          LATEST_TAG=$(git tag -l "ep-v*" --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            VERSION="0.1.0"
          else
            VERSION=$(echo "$LATEST_TAG" | sed 's/ep-v//')
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3 | cut -d- -f1)
            PATCH=$((PATCH + 1))
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=ep-v$VERSION" >> "$GITHUB_OUTPUT"

  build-rust:
    needs: version
    runs-on: arc-runners-helpin-ai
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Docker socket
        run: |
          if [ -S /var/run/docker.sock ]; then
            sudo chmod 666 /var/run/docker.sock || true
          fi
          docker version
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Rust capture image
        uses: docker/build-push-action@v5
        with:
          context: events-pipeline/rust-capture
          push: true
          tags: |
            ${{ env.RUST_IMAGE }}:prod-latest
            ${{ env.RUST_IMAGE }}:${{ needs.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [version, build-rust]
    runs-on: arc-runners-helpin-ai
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create git tag
        run: |
          git tag ${{ needs.version.outputs.tag }}
          git push origin ${{ needs.version.outputs.tag }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "Release: Events Pipeline ${{ needs.version.outputs.version }}"
          generate_release_notes: true
      - name: Update K8s manifests
        run: |
          sed -i "s|${{ env.RUST_IMAGE }}:[^ ]*|${{ env.RUST_IMAGE }}:${{ needs.version.outputs.tag }}|g" k8s/prod/events-pipeline/deployments/eventpipeline-web.yaml
          sed -i "s|${{ env.RUST_IMAGE }}:[^ ]*|${{ env.RUST_IMAGE }}:${{ needs.version.outputs.tag }}|g" k8s/prod/events-pipeline/deployments/eventpipeline-writer.yaml
          if git diff --quiet; then
            echo "No manifest changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add k8s/prod/events-pipeline/
            git commit -m "chore: update helpin events-pipeline prod images to ${{ needs.version.outputs.tag }} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
