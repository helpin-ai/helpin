[package]
name = "tauri-plugin-helpin-push"
version = "0.1.0"
description = "Tauri plugin bridging FCM/APNs push tokens and tap payloads for Helpin Support mobile"
edition = "2021"
authors = ["Helpin"]
license = "MIT OR Apache-2.0"
rust-version = "1.77.2"
links = "tauri-plugin-helpin-push"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
