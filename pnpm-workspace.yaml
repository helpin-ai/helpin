packages:
  - "packages/*"
  - "apps/*"
  - "frontend"
  - "website"
  - "help-center"

# These libraries import React types but omit the peer; use the consuming app's version.
packageExtensions:
  cmdk@1.1.1:
    peerDependencies:
      "@types/react": "^18 || ^19"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  next-themes@0.4.6:
    peerDependencies:
      "@types/react": "^16.8 || ^17 || ^18 || ^19"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  vaul@1.1.2:
    peerDependencies:
      "@types/react": "^16.8 || ^17 || ^18 || ^19"
    peerDependenciesMeta:
      "@types/react":
        optional: true

# Patch vulnerable transitive dependencies within their existing major lines.
overrides:
  "brace-expansion@1": "1.1.18"
  "brace-expansion@2": "2.1.4"
  "brace-expansion@3": "3.0.6"
  "brace-expansion@5": "5.0.9"
  "browserslist@4": "4.28.7"
  "fast-uri@2": "2.4.5"
  "fast-uri@3": "3.1.6"
  "fast-uri@4": "4.1.3"
  "hono@4": "4.12.25"
  "ip-address@10": "10.3.1"
  "js-yaml@3": "3.15.2"
  "js-yaml@4": "4.3.2"
  "nanoid@3": "3.3.18"
  "nanoid@5": "5.1.16"
  "path-to-regexp@8": "8.4.0"
  "picomatch@2": "2.3.2"
  "picomatch@3": "3.0.2"
  "picomatch@4": "4.0.4"
  "postcss@8": "8.5.18"
  "seroval@1": "1.5.3"
  "undici@6": "6.27.0"
  "undici@7": "7.29.0"
  "vite@7": "7.3.5"
