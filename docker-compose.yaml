services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: helpin-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: helpin
      POSTGRES_PASSWORD: helpin
      POSTGRES_DB: helpin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpin -d helpin"]
      interval: 5s
      timeout: 3s
      retries: 5

  temporal-postgres:
    image: postgres:16-alpine
    container_name: helpin-temporal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:latest
    container_name: helpin-temporal
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development-sql.yaml
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    depends_on:
      temporal-postgres:
        condition: service_healthy
    volumes:
      - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro

  temporal-ui:
    image: temporalio/ui:latest
    container_name: helpin-temporal-ui
    restart: unless-stopped
    ports:
      - "8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    depends_on:
      temporal:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: helpin-pgadmin
    restart: unless-stopped
    ports:
      - "0.0.0.0:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@helpin.ai
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  nats:
    image: nats:2.14.5-alpine@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da
    container_name: helpin-nats
    restart: unless-stopped
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
    command: ["-js", "--store_dir=/data", "-m", "8222"]
    volumes:
      - nats_data:/data

  redis:
    image: redis:7-alpine
    container_name: helpin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-helpin-redis-dev}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-helpin-redis-dev}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"${REDIS_PASSWORD:-helpin-redis-dev}\" redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  temporal-worker:
    build:
      context: ./server
      target: temporal-worker
    command: ["./temporal-worker"]
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://helpin:helpin@postgres:5432/helpin?sslmode=disable
      - JWT_SECRET=dev-secret-change-in-prod
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://:${REDIS_PASSWORD:-helpin-redis-dev}@redis:6379/0
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
      - TEMPORAL_TLS_ENABLED=false
      - TEMPORAL_API_KEY=
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

