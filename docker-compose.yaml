services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: helpin-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: helpin
      POSTGRES_PASSWORD: helpin
      POSTGRES_DB: helpin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpin -d helpin"]
      interval: 5s
      timeout: 3s
      retries: 5

  temporal-postgres:
    image: postgres:16-alpine
    container_name: helpin-temporal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:latest
    container_name: helpin-temporal
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development-sql.yaml
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    depends_on:
      temporal-postgres:
        condition: service_healthy
    volumes:
      - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro

  temporal-ui:
    image: temporalio/ui:latest
    container_name: helpin-temporal-ui
    restart: unless-stopped
    ports:
      - "8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    depends_on:
      temporal:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: helpin-pgadmin
    restart: unless-stopped
    ports:
      - "0.0.0.0:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@helpin.ai
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  nats:
    image: nats:2.14.5-alpine@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da
    container_name: helpin-nats
    restart: unless-stopped
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
    command: ["-js", "--store_dir=/data", "-m", "8222"]
    volumes:
      - nats_data:/data

  redis:
    image: redis:7-alpine
    container_name: helpin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-helpin-redis-dev}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-helpin-redis-dev}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"${REDIS_PASSWORD:-helpin-redis-dev}\" redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: helpin-kafka
    profiles: ["events"]
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: helpin-kafka-init
    profiles: ["events"]
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        for topic in \
          helpin.events.raw \
          helpin.events.enriched \
          helpin.events.enriched.dlq \
          helpin.events.sessionized; do
          kafka-topics --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions 1 --replication-factor 1
        done

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: helpin-clickhouse
    profiles: ["events"]
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: usermaven
      CLICKHOUSE_USER: helpin
      CLICKHOUSE_PASSWORD: helpin
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user helpin --password helpin --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  event-capture:
    image: helpin-events-pipeline:local
    build:
      context: ./events-pipeline/rust-capture
    container_name: helpin-event-capture
    profiles: ["events"]
    restart: unless-stopped
    command: ["events-pipeline"]
    ports:
      - "3000:3000"
      - "3001:3001"
    environment: &event-pipeline-environment
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: helpin.events.raw
      KAFKA_TRANSFORMATION_TOPIC: helpin.events.enriched
      KAFKA_TRANSFORMATION_ERROR_TOPIC: helpin.events.enriched.dlq
      KAFKA_SESSIONIZED_TOPIC: helpin.events.sessionized
      KAFKA_AUTH: "false"
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      APP_ENV: dev
      PRINT_SINK: "false"
      NETWORK_ENRICHMENT_ENABLED: "false"
      HTTP_TOKENS_URL: http://host.docker.internal:8080/api/internal/widget-tokens
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      FALLBACK_DIR: /data/fallback
      LOG_LEVEL: INFO
    volumes:
      - event_fallback_data:/data/fallback
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health/liveness"]
      interval: 5s
      timeout: 3s
      retries: 20

  event-transformer:
    image: helpin-events-pipeline:local
    pull_policy: never
    container_name: helpin-event-transformer
    profiles: ["events"]
    restart: unless-stopped
    command: ["consumer"]
    environment:
      <<: *event-pipeline-environment
      KAFKA_GROUP_ID: helpin-event-transformer-local
    depends_on:
      kafka:
        condition: service_healthy

  event-sessionizer:
    build:
      context: ./events-pipeline/kafka-streams
    image: helpin-event-sessionizer:local
    container_name: helpin-event-sessionizer
    profiles: ["events"]
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TRANSFORMATION_TOPIC: helpin.events.enriched
      KAFKA_SESSIONIZED_TOPIC: helpin.events.sessionized
      KAFKA_AUTH: "false"
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
    depends_on:
      kafka:
        condition: service_healthy

  event-replay:
    image: helpin-events-pipeline:local
    pull_policy: never
    container_name: helpin-event-replay
    profiles: ["events"]
    restart: unless-stopped
    command: ["replay-worker"]
    environment:
      <<: *event-pipeline-environment
      REPLAY_BATCH_SIZE: 100
      REPLAY_POLL_INTERVAL_SECS: 5
      REPLAY_CLEANUP_HOURS: 24
    volumes:
      - event_fallback_data:/data/fallback
    depends_on:
      kafka:
        condition: service_healthy

  temporal-worker:
    build:
      context: ./server
      target: temporal-worker
    command: ["./temporal-worker"]
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://helpin:helpin@postgres:5432/helpin?sslmode=disable
      - JWT_SECRET=dev-secret-change-in-prod
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://:${REDIS_PASSWORD:-helpin-redis-dev}@redis:6379/0
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
      - TEMPORAL_TLS_ENABLED=false
      - TEMPORAL_API_KEY=
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

