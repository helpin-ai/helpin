server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /lib.js {
        try_files $uri =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location ~ ^/helpin\.[^/]+\.(js|css)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /chunks/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /sounds/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
