server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Configure HELPIN_API_ORIGIN to the API's internal origin for dynamic
    # previews. The API fetches the raw /index.html shell via APP_INDEX_URL.
    location = /index.html { try_files /index.html =404; add_header Cache-Control "no-store"; }
    location = /api/link-previews/image {
        proxy_pass ${HELPIN_API_ORIGIN};
        proxy_read_timeout 6s;
    }

    location = /lib.js {
        try_files $uri =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location ~ ^/helpin\.[^/]+\.(js|css)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /chunks/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /sounds/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri @app_preview;
    }

    location @app_preview {
        rewrite ^ /api/link-previews/html break;
        proxy_pass ${HELPIN_API_ORIGIN};
        proxy_set_header X-Helpin-App-URI $request_uri;
        proxy_intercept_errors on;
        error_page 429 500 502 503 504 = /index.html;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
