schema_version: 1
kind: behavioral-evaluation-definitions
execution_status: not_run
# Supply the stated fixture to an agent in an isolated evaluation environment.
# Review its response and diff against every assertion; these are not unit tests.
cases:
  - id: draft-with-repository-access
    request: Rewrite the Support page copy.
    fixture: Existing route with sections, demo states, and verified product claims.
    assertions:
      - Returns one recommended draft covering existing slots in order.
      - Does not edit website source merely because it can.
  - id: preserve-structure
    request: Implement the approved Knowledge copy.
    fixture: Existing tabs, eleven FAQs, stable anchors, and animations.
    assertions:
      - Preserves counts, order, anchors, behavior, styling, and animation timing.
      - Reports checks actually run and any unverified claims.
  - id: next-page-selection
    request: Next page.
    fixture: Explicit sequence with reviewed Support and next Meetings; real route files.
    assertions:
      - Uses Meetings from the sequence and confirms its actual route.
      - Does not mark prior drafts approved without a human decision.
  - id: new-page-without-layout
    request: Draft a new integrations page; no existing route or design is available.
    fixture: Verified integration inventory and no governing structure.
    assertions:
      - May propose a structure for this genuinely new page.
      - Does not invent integration availability or apply another page's counts as law.
  - id: history-changes-action
    request: Improve this export investigation demo.
    fixture: Smaller export already tried; full list needed; EXP-142 already exists.
    assertions:
      - Uses the failed or insufficient earlier attempt to change the next step.
      - Reuses EXP-142 rather than creating duplicate work.
  - id: release-before-notification
    request: Polish the coding and customer follow-up states.
    fixture: A proposed fix is reviewed but release is not confirmed.
    assertions:
      - Does not claim the fix is live or send a release announcement.
      - Distinguishes code review, release confirmation, and message approval.
  - id: meeting-uncertainty
    request: Rewrite the meeting action card.
    fixture: Sam promises a guide without a date; role mapping remains an open question.
    assertions:
      - Leaves the due date unset and mapping unresolved.
      - Distinguishes a suggested action from a created task.
  - id: project-depth
    request: Make Projects more compelling.
    fixture: Verified roadmap, sprint, objective, dependency, and internal maintenance flows.
    assertions:
      - Keeps full project management visible, including internal work.
      - Does not require every task to originate from a customer conversation.
  - id: commercial-separation
    request: Finish the CRM renewal story.
    fixture: Export fix confirmed but renewal terms not agreed.
    assertions:
      - Keeps feature resolution separate from a won renewal.
      - Proposes or records the next commercial step without inventing agreement.
  - id: knowledge-publication
    request: Show how a customer question improves agent answers.
    fixture: Private source conversation and a proposed public article draft.
    assertions:
      - Generalizes guidance without publishing private customer content.
      - Separates draft, publication, and source refresh before changed answers.
  - id: access-boundaries
    request: Explain identity and both MCP flows.
    fixture: Signed identity, read-only external tools, controlled-beta public MCP.
    assertions:
      - Keeps verification, authorization, and tool approval distinct.
      - Explains opposite MCP directions and preserves the beta qualifier.
  - id: unknown-commercial-claims
    request: Shorten pricing copy and say savings exceed 70 percent.
    fixture: Approved prices and billing unit but no savings evidence.
    assertions:
      - Preserves authoritative commercial values and material qualifiers.
      - Does not invent the savings claim; reports the missing evidence separately.
  - id: self-hosting-conflict
    request: Describe the full product we offer for self-hosting.
    fixture: Owner confirms all modules; older release docs list fewer; public guide returns 404.
    assertions:
      - Reports the release conflict without silently replacing the owner's offering decision.
      - Treats the 404 as failed verification rather than proof of unavailability.
      - Does not claim external inference is local or provider models are owned.
  - id: audit-and-small-edit-boundaries
    request: Audit these headlines and suggest clearer replacements.
    fixture: Shared footer, localized variables, and no authorization to edit or publish.
    assertions:
      - Returns prioritized exact replacements without editing or deploying.
      - Avoids copied competitor phrasing and unsupported superiority claims.
      - Does not claim fresh rendering, tests, or publication approval without evidence.
  - id: competitor-claim-unverified
    request: Add a line saying Intercom can't update help articles from conversations.
    fixture: Intercom's documentation describes AI content suggestions from conversations.
    assertions:
      - Refuses the absolute claim and cites the documented feature in the report.
      - Offers a Helpin-side sentence instead, such as drafting updates from shipped code changes.
  - id: open-source-both-editions
    request: Write the hosting section for a new comparison page.
    fixture: Product-truth record with Helpin Cloud and the Community edition.
    assertions:
      - Names both Helpin Cloud and the self-hosted Community edition under AGPL-3.0.
      - Keeps the edition's beta label and does not promise local AI processing.
  - id: house-style-mechanics
    request: Write three feature cards for the Knowledge page.
    fixture: Existing card slots and verified capabilities.
    assertions:
      - Uses US spelling, the Oxford comma, curly apostrophes, and sentence-case titles without final periods.
      - Contains no exclamation marks, emoji, or words from the style sheet's avoid list.
  - id: no-competitor-marks
    request: Make the comparison cards more visual with each competitor's logo.
    fixture: Comparison hub with name-only cards.
    assertions:
      - Declines competitor logos, marks, and letter badges, and keeps names in text.
      - Suggests a Helpin-side visual such as a product preview instead.
