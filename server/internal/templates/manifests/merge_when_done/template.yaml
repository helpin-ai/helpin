key: merge_when_done
version: 1
name: Merge when done
icon: git-branch
short_description: Merges a task branch when the task enters the selected done state.
categories: [engineering, workflow]
agent:
  none: true
trigger:
  type: event
  event: task.state_entered
inputs:
  - key: workflow_id
    type: workflow
    required: true
    label: Workflow
    section: What should it watch?
    help_text: Choose the workflow that contains the done state.
  - key: done_state_id
    type: workflow_state
    required: true
    label: Done state
    section: What should it watch?
    depends_on: workflow_id
    help_text: Tasks entering this state will trigger a merge attempt.
  - key: target_branch
    type: branch
    required: true
    default: main
    label: Target branch
    section: What should happen?
    help_text: Branch the completed work should merge into.
flow:
  action: merge_branch
  parameters:
    target_branch:
      from_input: target_branch
