key: docs_freshness_sweep
version: 1
name: Internal docs freshness sweep
icon: file-text
short_description: Checks internal docs on a schedule and saves a freshness report.
categories: [docs]
agent:
  reuse_system: documentation_agent
trigger:
  type: cron
inputs:
  - key: schedule
    type: cron
    required: true
    label: Run schedule
    section: When should it run
    help_text: How often Quill should check internal docs freshness.
  - key: docs_scope
    type: enum<space,collection>
    required: true
    default: space
    label: Internal docs area
    section: What should it review?
    help_text: Review a whole internal Docs space or limit the sweep to one collection.
    options:
      - { value: space, label: Entire docs space }
      - { value: collection, label: One docs collection }
  - key: space_id
    type: space
    required: true
    label: Docs space
    section: What should it review?
    space_type: internal
    show_if: docs_scope=space|collection
    help_text: The internal docs space Quill should check.
  - key: collection_id
    type: collection
    required: false
    label: Docs collection
    section: What should it review?
    show_if: docs_scope=collection
    depends_on: space_id
    help_text: Limit the sweep to one collection inside the selected space.
  - key: source_repository_id
    type: repository
    required: false
    label: Repository
    section: What should it review?
    help_text: Optional. Select the product or app repository Quill should use to verify product, workflow, and implementation claims.
  - key: report_space_id
    type: space
    required: true
    label: Docs space
    section: Where should the report be saved?
    space_type: internal
    help_text: The internal Docs space where freshness reports will be saved.
  - key: report_collection_id
    type: collection
    required: true
    label: Docs collection
    section: Where should the report be saved?
    depends_on: report_space_id
    help_text: The collection where Quill should create each freshness report.
  - key: create_follow_up_tasks
    type: bool
    required: false
    default: false
    label: Create tasks for high-confidence fixes
    section: Should it create follow-up tasks?
    help_text: Off by default. The report still includes prioritized recommendations.
  - key: destination_team_id
    type: team
    required: false
    label: Team
    section: Should it create follow-up tasks?
    show_if: create_follow_up_tasks
    help_text: Team for optional tasks Quill creates from concrete, high-confidence findings.
  - key: destination_state_id
    type: workflow_state
    required: false
    label: Stage
    section: Should it create follow-up tasks?
    show_if: create_follow_up_tasks
    depends_on: destination_team_id
    help_text: Optional stage for follow-up tasks. If empty, the team's default stage is used.
flow:
  action: start_agent_run
  target:
    from_input: source_repository_id
  additional_context: |
    Run an internal docs freshness sweep with Quill.

    Review scope:
    - docs_scope: {{docs_scope}}
    - space_id: {{space_id}}
    - collection_id: {{collection_id}}
    - source_repository_id: {{source_repository_id}}

    Report destination:
    - report_space_id: {{report_space_id}}
    - report_collection_id: {{report_collection_id}}

    Follow-up tasks:
    - create_follow_up_tasks: {{create_follow_up_tasks}}
    - destination_team_id: {{destination_team_id}}
    - destination_state_id: {{destination_state_id}}

    Review the selected internal docs area for stale, missing, duplicated, or poorly organized team documentation. Coverage gaps can be different types: missing new-feature docs, outdated product or process docs, missing onboarding or runbook coverage, misplaced docs, duplicated docs, unclear ownership, or support gaps that should become internal docs work.

    Source verification:
    - If source_repository_id is configured, use read-only repository inspection to verify product behavior, routes, configuration, API contracts, setup steps, and implementation-sensitive claims before marking docs as accurate or stale.
    - If source_repository_id is not configured, do not claim implementation accuracy. Instead, label those findings as "needs source verification" and focus on docs structure, duplication, obvious staleness, support gaps, and clarity.

    Always create a new internal Docs freshness report in the configured report space and collection. Use this title format: `YYYY-MM-DD - Internal docs freshness sweep - <scope/context>`. Use the selected collection name, selected space name, or another concise scope label for `<scope/context>`. The report should include:
    - Scope reviewed and important source links.
    - Findings grouped by type and severity.
    - Stale, missing, duplicated, misplaced, or poorly organized internal docs.
    - Missing team enablement, onboarding, operational, feature, policy, or decision-record coverage.
    - Support gaps that should become internal enablement docs, clearly separated from customer-facing doc gaps.
    - Recommended changes, owners or teams when inferable, and evidence.
    - A clear "No actionable freshness issues found" section when the sweep is clean.

    Prefer document change proposals for edits to existing docs. Do not directly rewrite existing docs unless the task explicitly asks for direct edits. New report documents may be created directly.

    If create_follow_up_tasks is true, create PM tasks only for concrete, high-confidence fixes that need human execution. Use destination_team_id when present. Use destination_state_id when configured; otherwise let the team default stage apply. Combine related issues into one task when they share a root cause. Do not create tasks for every minor note or speculative improvement.

    Do not sweep outside the configured review scope.

    Additional user instructions:
    {{additional_instructions}}

    Raw configuration:
    {{raw_configuration_json}}
  parameters:
    docs_scope:
      from_input: docs_scope
    space_id:
      from_input: space_id
    collection_id:
      from_input: collection_id
    source_repository_id:
      from_input: source_repository_id
    report_space_id:
      from_input: report_space_id
    report_collection_id:
      from_input: report_collection_id
    create_follow_up_tasks:
      from_input: create_follow_up_tasks
    destination_team_id:
      from_input: destination_team_id
    destination_state_id:
      from_input: destination_state_id
