key: run_on_a_schedule
version: 1
name: Run on a schedule
icon: clock
short_description: Runs an existing agent on a recurring schedule.
agent:
  pick_existing:
    required: true
    constraints:
      targets: [workspace, task, epic, repository, document]
trigger:
  type: cron
inputs:
  - key: agent_id
    type: agent
    required: true
    label: Agent
  - key: schedule
    type: cron
    required: true
    label: Schedule
flow:
  action: start_agent_run
  parameters:
    agent_id:
      from_input: agent_id
