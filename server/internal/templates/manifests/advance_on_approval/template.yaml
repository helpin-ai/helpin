key: advance_on_approval
version: 1
name: Advance on approval
icon: check
short_description: Moves a task forward when an interactive agent run is approved.
categories: [workflow]
agent:
  none: true
trigger:
  type: event
  event: agent_run.approved
inputs:
  - key: workflow_id
    type: workflow
    required: true
    label: Workflow
    section: What should it watch?
    help_text: Choose the workflow that contains the approval and destination states.
  - key: from_state_id
    type: workflow_state
    required: true
    label: Approval state
    section: What should it watch?
    depends_on: workflow_id
    help_text: Tasks entering this state will be treated as approved.
  - key: to_state_id
    type: workflow_state
    required: true
    label: Destination state
    section: Where should tasks move?
    depends_on: workflow_id
    help_text: The state approved tasks should move to automatically.
flow:
  action: move_to_state
  parameters:
    target_state_id:
      from_input: to_state_id
