# Helpin Temporal Worker configuration
#
# This package enables both Codex-related autonomous queues by default.
# The host must have both CLIs installed and reachable, either on PATH or
# through the optional *_PATH overrides below.

DOPPLER_PROJECT=backend
DOPPLER_CONFIG=prd
TEMPORAL_WORKER_QUEUES=agent-opencode-autonomous,agent-codex-autonomous

# Required for the updater to access private GitHub releases.
GH_TOKEN=

# Optional runtime path overrides.
# CODEX_PATH=/usr/bin/codex
# OPENCODE_PATH=/usr/bin/opencode
