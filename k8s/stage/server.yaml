apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpin-server
  namespace: helpin
  labels:
    app: helpin-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helpin-server
  template:
    metadata:
      labels:
        app: helpin-server
        env: stage
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-helpin-json-key
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-data
          emptyDir: {}
      containers:
        - name: helpin-server
          image: ghcr.io/helpin-ai/helpin/server:server-v0.95.395-rc.1
          envFrom:
            - secretRef:
                name: helpin-secrets
          env:
            - name: CLICKHOUSE_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helpin-eventpipeline-secrets
                  key: CLICKHOUSE_API_PASSWORD
            - name: CLICKHOUSE_DSN
              value: clickhouse://helpin_api:$(CLICKHOUSE_API_PASSWORD)@helpin-clickhouse.helpin.svc.cluster.local:9000/helpin
            - name: RUN_AUTO_MIGRATE
              value: "true"
            - name: SUPPORT_COVERAGE_V2_MODE
              value: "shadow"
            - name: MCP_PUBLIC_BASE_URL
              value: "https://mcp.stage.helpin.ai"
            - name: MCP_SERVER_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-data
              mountPath: /app/data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: helpin-server-svc
  namespace: helpin
  labels:
    app: helpin-server
spec:
  ports:
    - name: helpin-server-port
      port: 8080
      targetPort: 8080
  selector:
    app: helpin-server
  type: ClusterIP
