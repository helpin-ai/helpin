apiVersion: batch/v1
kind: CronJob
metadata:
  name: helpin-git-pr-status-reconciler
  namespace: helpin
  labels:
    app: helpin-git-pr-status-reconciler
    env: stage
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: helpin-git-pr-status-reconciler
            env: stage
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-helpin-json-key
          containers:
            - name: reconcile
              image: ghcr.io/helpin-ai/helpin/server:server-v0.95.253-rc.1
              command: ["./reconcile-git-pr-status", "--apply", "--limit=200"]
              envFrom:
                - secretRef:
                    name: helpin-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
