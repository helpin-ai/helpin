apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpin-temporal-native-interactive
  namespace: helpin
  labels:
    app: helpin-temporal-native-interactive
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  replicas: 1
  selector:
    matchLabels:
      app: helpin-temporal-native-interactive
  template:
    metadata:
      labels:
        app: helpin-temporal-native-interactive
        env: stage
    spec:
      terminationGracePeriodSeconds: 660
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-helpin-json-key
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: temporal-worker
          image: ghcr.io/helpin-ai/helpin/temporal-worker:server-v0.95.262-rc.4
          command: ["./temporal-worker"]
          env:
            - name: TEMPORAL_WORKER_QUEUES
              value: agent-native-interactive
            - name: CODEX_HELPIN_API_BASE_URL
              value: http://helpin-server-svc:8080/api
          envFrom:
            - secretRef:
                name: helpin-secrets
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
