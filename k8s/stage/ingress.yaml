apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-helpin
  namespace: helpin
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: pp-nginx
  tls:
  - hosts:
    - api.stage.helpin.ai
    - helpcenter-stage.helpin.ai
    secretName: cert-stage-helpin-wildcard
  rules:
  - host: api.stage.helpin.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: helpin-server-svc
            port:
              number: 8080
  - host: helpcenter-stage.helpin.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: helpin-helpcenter-svc
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-helpin-helpcenter-stage-wildcard
  namespace: helpin
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: pp-nginx
  tls:
  - hosts:
    - '*.stage.helpin.center'
    secretName: cert-stage-helpin-center
  rules:
  - host: '*.stage.helpin.center'
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: helpin-helpcenter-svc
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-helpin-helpcenter-stage-catchall
  namespace: helpin
spec:
  ingressClassName: pp-nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: helpin-helpcenter-svc
            port:
              number: 80
