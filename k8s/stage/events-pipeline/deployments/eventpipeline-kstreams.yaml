          #       secretKeyRef:
          #         name: helpin-cluster-ca-cert
          #         key: ca.password
          #   - name: KEYSTORE_PASSWORD
          #     valueFrom:
          #       secretKeyRef:
          #         name: helpin-eventpipeline-transform
          #         key: user.password
