apiVersion: v1
kind: ConfigMap
metadata:
  name: helpin-eventpipeline-nats-config
  namespace: helpin
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  nats.conf: |
    server_name: $POD_NAME
    port: 4222
    http_port: 8222
    max_payload: 8MB

    jetstream {
      store_dir: /data/jetstream
      max_memory_store: 1GB
      # Functional stage budget: 8GiB work, 4GiB raw, and 1GiB DLQ.
      max_file_store: 15GB
      cipher: chachapoly
      key: "$JS_ENCRYPTION_KEY"
      # Pin the server default. Tune only from a storage benchmark.
      sync_interval: "2m"
    }

    tls {
      cert_file: /etc/nats/tls/tls.crt
      key_file: /etc/nats/tls/tls.key
      ca_file: /etc/nats/tls/ca.crt
      verify: true
      min_version: "1.3"
      timeout: 3
    }

    cluster {
      name: helpin-events-stage
      port: 6222
      cluster_advertise: "${POD_NAME}.helpin-eventpipeline-nats-headless.helpin.svc.cluster.local:6222"
      routes: [
        nats-route://helpin-eventpipeline-nats-0.helpin-eventpipeline-nats-headless.helpin.svc.cluster.local:6222,
        nats-route://helpin-eventpipeline-nats-1.helpin-eventpipeline-nats-headless.helpin.svc.cluster.local:6222,
        nats-route://helpin-eventpipeline-nats-2.helpin-eventpipeline-nats-headless.helpin.svc.cluster.local:6222
      ]
      tls {
        cert_file: /etc/nats/tls/tls.crt
        key_file: /etc/nats/tls/tls.key
        ca_file: /etc/nats/tls/ca.crt
        min_version: "1.3"
        timeout: 3
      }
    }

    authorization {
      users: [
        {
          user: capture
          password: "$NATS_CAPTURE_PASSWORD"
          permissions: {
            publish: ["events.enriched.v1.*", "events.raw.v1", "events.dlq.v1.capture"]
            subscribe: ["_INBOX.>"]
          }
        },
        {
          user: writer
          password: "$NATS_WRITER_PASSWORD"
          permissions: {
            publish: [
              "$JS.API.STREAM.INFO.EVENTS_ENRICHED_V1",
              "$JS.API.CONSUMER.INFO.EVENTS_ENRICHED_V1.*",
              "$JS.API.CONSUMER.MSG.NEXT.EVENTS_ENRICHED_V1.*",
              "$JS.API.DIRECT.GET.EVENTS_ENRICHED_V1",
              "$JS.ACK.>",
              "events.dlq.v1.writer"
            ]
            subscribe: ["_INBOX.>"]
          }
        },
        {
          user: ops
          password: "$NATS_OPS_PASSWORD"
          permissions: {
            publish: [">", "$JS.API.>"]
            subscribe: [">"]
          }
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: helpin-eventpipeline-nats-headless
  namespace: helpin
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: helpin-eventpipeline-nats
  ports:
    - name: client
      port: 4222
    - name: cluster
      port: 6222
    - name: monitor
      port: 8222
---
apiVersion: v1
kind: Service
metadata:
  name: helpin-eventpipeline-nats
  namespace: helpin
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  selector:
    app: helpin-eventpipeline-nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: helpin-eventpipeline-nats
  namespace: helpin
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: helpin-eventpipeline-nats
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: helpin-eventpipeline-nats
  namespace: helpin
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  serviceName: helpin-eventpipeline-nats-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: helpin-eventpipeline-nats
  template:
    metadata:
      labels:
        app: helpin-eventpipeline-nats
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: amd64
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: helpin-eventpipeline-nats
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nats
          image: nats:2.14.5-alpine@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da
          command: ["nats-server"]
          args: ["--config", "/etc/nats-config/nats.conf"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: JS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: helpin-eventpipeline-nats-secrets
                  key: jetstream-encryption-key
            - name: NATS_CAPTURE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helpin-eventpipeline-nats-secrets
                  key: capture-password
            - name: NATS_WRITER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helpin-eventpipeline-nats-secrets
                  key: writer-password
            - name: NATS_OPS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helpin-eventpipeline-nats-secrets
                  key: ops-password
          ports:
            - name: client
              containerPort: 4222
            - name: cluster
              containerPort: 6222
            - name: monitor
              containerPort: 8222
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/nats-config
              readOnly: true
            - name: tls
              mountPath: /etc/nats/tls
              readOnly: true
            - name: jetstream
              mountPath: /data/jetstream
      volumes:
        - name: config
          configMap:
            name: helpin-eventpipeline-nats-config
        - name: tls
          secret:
            secretName: helpin-eventpipeline-nats-server-tls
  volumeClaimTemplates:
    - metadata:
        name: jetstream
      spec:
        accessModes: ["ReadWriteOnce"]
        # Set storageClassName to the stage provisioned-IOPS NVMe class before
        # using stage for performance qualification.
        resources:
          requests:
            storage: 8Gi
