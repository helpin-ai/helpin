apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-helpin-eventpipeline
  namespace: helpin
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: pp-nginx
  tls:
    - hosts:
        - client.stage.helpin.ai
      secretName: cert-stage-helpin-wildcard
  rules:
    - host: client.stage.helpin.ai
      http:
        paths:
          # Events capture (Rust service)
          - path: /api/v1/
            pathType: Prefix
            backend:
              service:
                name: helpin-eventpipeline-web
                port:
                  number: 80
          # Widget SDK: config, session, messages, settings, ws (Go server)
          - path: /widget/
            pathType: Prefix
            backend:
              service:
                name: helpin-server-svc
                port:
                  number: 8080
