apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: doppler-helpin-eventpipeline
  namespace: helpin
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token-helpin-eventpipeline
            key: dopplerToken
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: helpin-eventpipeline-secrets
  namespace: helpin
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: doppler-helpin-eventpipeline
  target:
    name: helpin-eventpipeline-secrets
    creationPolicy: Owner
  data:
    - secretKey: NATS_JETSTREAM_ENCRYPTION_KEY
      remoteRef:
        key: NATS_JETSTREAM_ENCRYPTION_KEY
    - secretKey: NATS_CAPTURE_PASSWORD
      remoteRef:
        key: NATS_CAPTURE_PASSWORD
    - secretKey: NATS_WRITER_PASSWORD
      remoteRef:
        key: NATS_WRITER_PASSWORD
    - secretKey: NATS_OPS_PASSWORD
      remoteRef:
        key: NATS_OPS_PASSWORD
    - secretKey: CLICKHOUSE_MIGRATION_PASSWORD
      remoteRef:
        key: CLICKHOUSE_MIGRATION_PASSWORD
    - secretKey: CLICKHOUSE_API_PASSWORD
      remoteRef:
        key: CLICKHOUSE_API_PASSWORD
    - secretKey: CLICKHOUSE_WRITER_PASSWORD
      remoteRef:
        key: CLICKHOUSE_WRITER_PASSWORD
    - secretKey: CLICKHOUSE_R2_ENDPOINT
      remoteRef:
        key: CLICKHOUSE_R2_ENDPOINT
    - secretKey: CLICKHOUSE_R2_ACCESS_KEY_ID
      remoteRef:
        key: CLICKHOUSE_R2_ACCESS_KEY_ID
    - secretKey: CLICKHOUSE_R2_SECRET_ACCESS_KEY
      remoteRef:
        key: CLICKHOUSE_R2_SECRET_ACCESS_KEY
