apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
metadata:
  name: helpin-keeper
  namespace: helpin
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  configuration:
    clusters:
      - name: keeper
        layout:
          replicasCount: 3
    settings:
      logger/level: information
      logger/console: "true"
      listen_host: 0.0.0.0
      keeper_server/storage_path: /var/lib/clickhouse-keeper
      keeper_server/tcp_port: "2181"
      keeper_server/four_letter_word_white_list: ruok,mntr,stat
      keeper_server/coordination_settings/raft_logs_level: information
      keeper_server/raft_configuration/server/port: "9444"
      prometheus/endpoint: /metrics
      prometheus/port: "7000"
      prometheus/metrics: "true"
      prometheus/events: "true"
      prometheus/asynchronous_metrics: "true"
  templates:
    podTemplates:
      - name: default
        metadata:
          annotations:
            helpin.ai/keeper-config-revision: "2026-08-27-1"
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/worker
                        operator: In
                        values: [pipeline]
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: clickhouse-keeper
                  topologyKey: kubernetes.io/hostname
          tolerations:
            - key: node-role.kubernetes.io/worker
              operator: Equal
              value: pipeline
              effect: NoSchedule
          containers:
            - name: clickhouse-keeper
              image: clickhouse/clickhouse-keeper:26.3.17.110
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
    volumeClaimTemplates:
      - name: log-storage-path
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi
      - name: snapshot-storage-path
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi
---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: helpin-clickhouse
  namespace: helpin
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  configuration:
    zookeeper:
      nodes:
        - host: helpin-keeper
          port: 2181
    clusters:
      - name: helpin
        layout:
          shardsCount: 1
          replicasCount: 2
        templates:
          podTemplate: helpin-clickhouse
          dataVolumeClaimTemplate: helpin-clickhouse-data
    settings:
      compression/case/method: zstd
      keep_alive_timeout: 90
      max_concurrent_queries: 100
      prometheus/endpoint: /metrics
      prometheus/port: 9363
      prometheus/metrics: "true"
      prometheus/events: "true"
      prometheus/asynchronous_metrics: "true"
    files:
      config.d/events-storage.xml: |
        <clickhouse>
          <storage_configuration>
            <disks>
              <r2>
                <type>object_storage</type>
                <object_storage_type>s3</object_storage_type>
                <metadata_type>local</metadata_type>
                <endpoint from_env="CLICKHOUSE_R2_ENDPOINT"/>
                <access_key_id from_env="CLICKHOUSE_R2_ACCESS_KEY_ID"/>
                <secret_access_key from_env="CLICKHOUSE_R2_SECRET_ACCESS_KEY"/>
                <region>auto</region>
              </r2>
              <r2_cache>
                <type>cache</type>
                <disk>r2</disk>
                <path>/var/lib/clickhouse/r2-cache/</path>
                <max_size>8589934592</max_size>
                <cache_on_write_operations>true</cache_on_write_operations>
              </r2_cache>
            </disks>
            <policies>
              <events>
                <volumes>
                  <main><disk>r2_cache</disk></main>
                </volumes>
              </events>
            </policies>
          </storage_configuration>
        </clickhouse>
      users.d/helpin-users.xml: |
        <clickhouse>
          <users>
            <helpin_migration>
              <password from_env="CLICKHOUSE_MIGRATION_PASSWORD"/>
              <networks><ip>::/0</ip></networks>
              <profile>default</profile>
              <quota>default</quota>
              <grants>
                <query>GRANT CREATE DATABASE ON *.*</query>
                <query>GRANT CLUSTER ON *.*</query>
                <query>GRANT ALL ON helpin.*</query>
              </grants>
            </helpin_migration>
            <helpin_api>
              <password from_env="CLICKHOUSE_API_PASSWORD"/>
              <networks><ip>::/0</ip></networks>
              <profile>default</profile>
              <quota>default</quota>
              <grants>
                <query>GRANT SELECT, ALTER ON helpin.*</query>
              </grants>
            </helpin_api>
            <helpin_writer>
              <password from_env="CLICKHOUSE_WRITER_PASSWORD"/>
              <networks><ip>::/0</ip></networks>
              <profile>default</profile>
              <quota>default</quota>
              <grants>
                <query>GRANT SELECT, INSERT ON helpin.*</query>
              </grants>
            </helpin_writer>
          </users>
        </clickhouse>
  templates:
    podTemplates:
      - name: helpin-clickhouse
        metadata:
          annotations:
            helpin.ai/clickhouse-config-revision: "2026-08-27-1"
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/worker
                        operator: In
                        values: [clickhouse]
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      clickhouse.altinity.com/chi: helpin-clickhouse
                  topologyKey: kubernetes.io/hostname
          tolerations:
            - key: node-role.kubernetes.io/worker
              operator: Equal
              value: clickhouse
              effect: NoSchedule
          securityContext:
            fsGroup: 101
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:26.3.17.110
              env:
                - name: CLICKHOUSE_MIGRATION_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: helpin-eventpipeline-secrets
                      key: CLICKHOUSE_MIGRATION_PASSWORD
                - name: CLICKHOUSE_API_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: helpin-eventpipeline-secrets
                      key: CLICKHOUSE_API_PASSWORD
                - name: CLICKHOUSE_WRITER_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: helpin-eventpipeline-secrets
                      key: CLICKHOUSE_WRITER_PASSWORD
                - name: CLICKHOUSE_R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: helpin-eventpipeline-secrets
                      key: CLICKHOUSE_R2_ENDPOINT
                - name: CLICKHOUSE_R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: helpin-eventpipeline-secrets
                      key: CLICKHOUSE_R2_ACCESS_KEY_ID
                - name: CLICKHOUSE_R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: helpin-eventpipeline-secrets
                      key: CLICKHOUSE_R2_SECRET_ACCESS_KEY
              resources:
                requests:
                  cpu: 250m
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 6Gi
              volumeMounts:
                - name: helpin-clickhouse-data
                  mountPath: /var/lib/clickhouse
    volumeClaimTemplates:
      - name: helpin-clickhouse-data
        reclaimPolicy: Retain
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: helpin-clickhouse
  namespace: helpin
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  selector:
    clickhouse.altinity.com/chi: helpin-clickhouse
  ports:
    - name: native
      port: 9000
      targetPort: 9000
    - name: http
      port: 8123
      targetPort: 8123
    - name: metrics
      port: 9363
      targetPort: 9363
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: helpin-clickhouse
  namespace: helpin
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      clickhouse.altinity.com/chi: helpin-clickhouse
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: helpin-clickhouse-keeper
  namespace: helpin
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: clickhouse-keeper
