apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute-helpin
  namespace: helpin
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`helpin.ai`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: helpin-server-svc
          port: 8080
    - match: Host(`helpin.ai`)
      kind: Rule
      services:
        - name: helpin-frontend-svc
          port: 80
  tls:
    secretName: cert-prod-helpin-wildcard
