apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-helpin
  namespace: helpin
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: pp-nginx
  tls:
  - hosts:
    - api.prod.helpin.ai
    - helpcenter.helpin.ai
    - mcp.helpin.ai
    secretName: cert-prod-helpin-wildcard
  - hosts:
    - helpin.center
    secretName: cert-prod-helpin-center
  rules:
  - host: api.prod.helpin.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: helpin-server-svc
            port:
              number: 8080
  - host: mcp.helpin.ai
    http:
      paths:
      - path: /mcp
        pathType: Prefix
        backend:
          service:
            name: helpin-server-svc
            port:
              number: 8080
      - path: /.well-known/oauth-authorization-server
        pathType: Exact
        backend:
          service:
            name: helpin-server-svc
            port:
              number: 8080
      - path: /.well-known/oauth-protected-resource
        pathType: Exact
        backend:
          service:
            name: helpin-server-svc
            port:
              number: 8080
      - path: /api/mcp/oauth
        pathType: Prefix
        backend:
          service:
            name: helpin-server-svc
            port:
              number: 8080
  - host: helpcenter.helpin.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: helpin-helpcenter-svc
            port:
              number: 80
  - host: helpin.center
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: helpin-helpcenter-svc
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-helpin-helpcenter-wildcard
  namespace: helpin
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: pp-nginx
  tls:
  - hosts:
    - '*.helpin.center'
    secretName: cert-prod-helpin-center-wildcard
  rules:
  - host: '*.helpin.center'
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: helpin-helpcenter-svc
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-helpin-helpcenter-catchall
  namespace: helpin
spec:
  ingressClassName: pp-nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: helpin-helpcenter-svc
            port:
              number: 80
