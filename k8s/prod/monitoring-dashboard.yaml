{
  "apiVersion": "grafana.integreatly.org/v1beta1",
  "kind": "GrafanaDashboard",
  "metadata": {
    "name": "helpin-product-health",
    "namespace": "monitoring"
  },
  "spec": {
    "instanceSelector": {
      "matchLabels": {
        "dashboards": "grafana"
      }
    },
    "json": "{\"uid\": \"helpin-product-health\", \"title\": \"Helpin \\u2014 Product health\", \"schemaVersion\": 38, \"version\": 1, \"refresh\": \"30s\", \"time\": {\"from\": \"now-6h\", \"to\": \"now\"}, \"tags\": [\"helpin\"], \"panels\": [{\"id\": 1, \"title\": \"API requests / sec\", \"type\": \"timeseries\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(status)(rate(helpin_http_requests_total[5m]))\", \"legendFormat\": \"{{outcome}} {{stage}} {{browser}} {{worker}} {{operation}} {{status}}\"}], \"gridPos\": {\"x\": 0, \"y\": 0, \"w\": 12, \"h\": 8}}, {\"id\": 2, \"title\": \"API p95 seconds\", \"type\": \"timeseries\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"histogram_quantile(0.95,sum by(le)(rate(helpin_http_duration_seconds_bucket[5m])))\", \"legendFormat\": \"{{outcome}} {{stage}} {{browser}} {{worker}} {{operation}} {{status}}\"}], \"gridPos\": {\"x\": 12, \"y\": 0, \"w\": 12, \"h\": 8}}, {\"id\": 3, \"title\": \"Upload outcomes (15m)\", \"type\": \"timeseries\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(outcome,browser)(increase(helpin_widget_events_total{stage=\\\"upload\\\"}[15m]))\", \"legendFormat\": \"{{outcome}} {{stage}} {{browser}} {{worker}} {{operation}} {{status}}\"}], \"gridPos\": {\"x\": 0, \"y\": 8, \"w\": 12, \"h\": 8}}, {\"id\": 4, \"title\": \"Upload stage errors (15m)\", \"type\": \"timeseries\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(stage,browser)(increase(helpin_widget_events_total{outcome=~\\\"error|timeout|not_connected\\\"}[15m]))\", \"legendFormat\": \"{{outcome}} {{stage}} {{browser}} {{worker}} {{operation}} {{status}}\"}], \"gridPos\": {\"x\": 12, \"y\": 8, \"w\": 12, \"h\": 8}}, {\"id\": 5, \"title\": \"Live browser smoke success\", \"type\": \"timeseries\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"helpin_widget_smoke_success\", \"legendFormat\": \"{{outcome}} {{stage}} {{browser}} {{worker}} {{operation}} {{status}}\"}], \"gridPos\": {\"x\": 0, \"y\": 16, \"w\": 12, \"h\": 8}}, {\"id\": 6, \"title\": \"Smoke age seconds\", \"type\": \"timeseries\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"time()-helpin_widget_smoke_last_run_seconds\", \"legendFormat\": \"{{outcome}} {{stage}} {{browser}} {{worker}} {{operation}} {{status}}\"}], \"gridPos\": {\"x\": 12, \"y\": 16, \"w\": 12, \"h\": 8}}, {\"id\": 7, \"title\": \"Widget connection outcomes\", \"type\": \"timeseries\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(outcome,browser)(increase(helpin_widget_events_total{stage=\\\"connection\\\"}[15m]))\", \"legendFormat\": \"{{outcome}} {{stage}} {{browser}} {{worker}} {{operation}} {{status}}\"}], \"gridPos\": {\"x\": 0, \"y\": 24, \"w\": 12, \"h\": 8}}, {\"id\": 8, \"title\": \"AI outcomes (15m)\", \"type\": \"timeseries\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(operation,outcome)(increase(helpin_ai_decisions_total[15m]))\", \"legendFormat\": \"{{outcome}} {{stage}} {{browser}} {{worker}} {{operation}} {{status}}\"}], \"gridPos\": {\"x\": 12, \"y\": 24, \"w\": 12, \"h\": 8}}, {\"id\": 9, \"title\": \"Background worker errors (15m)\", \"type\": \"timeseries\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(worker)(increase(helpin_background_errors_total[15m]))\", \"legendFormat\": \"{{outcome}} {{stage}} {{browser}} {{worker}} {{operation}} {{status}}\"}], \"gridPos\": {\"x\": 0, \"y\": 32, \"w\": 12, \"h\": 8}}, {\"id\": 10, \"title\": \"AI p95 seconds\", \"type\": \"timeseries\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"histogram_quantile(0.95,sum by(le,operation)(rate(helpin_ai_duration_seconds_bucket[15m])))\", \"legendFormat\": \"{{outcome}} {{stage}} {{browser}} {{worker}} {{operation}} {{status}}\"}], \"gridPos\": {\"x\": 12, \"y\": 32, \"w\": 12, \"h\": 8}}, {\"id\": 11, \"title\": \"Message receipts reported by browsers\", \"type\": \"timeseries\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(browser)(increase(helpin_widget_events_total{stage=\\\"message\\\",outcome=\\\"success\\\"}[15m]))\", \"legendFormat\": \"{{outcome}} {{stage}} {{browser}} {{worker}} {{operation}} {{status}}\"}], \"gridPos\": {\"x\": 0, \"y\": 40, \"w\": 12, \"h\": 8}}]}"
  }
}
