{
  "apiVersion": "grafana.integreatly.org/v1beta1",
  "kind": "GrafanaDashboard",
  "metadata": {
    "name": "helpin-support-translation",
    "namespace": "monitoring"
  },
  "spec": {
    "instanceSelector": {
      "matchLabels": {
        "dashboards": "grafana"
      }
    },
    "json": "{\"uid\": \"helpin-support-translation\", \"title\": \"Helpin — Support translation\", \"schemaVersion\": 38, \"version\": 1, \"refresh\": \"30s\", \"time\": {\"from\": \"now-6h\", \"to\": \"now\"}, \"tags\": [\"helpin\", \"support\", \"translation\"], \"panels\": [{\"id\": 1, \"title\": \"Translation workflow outcomes (15m)\", \"type\": \"timeseries\", \"description\": \"Generated, cached and sent outcomes are separate events, not additive message counts. Sent means persisted through existing delivery guards; it does not prove receipt.\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(direction,outcome)(increase(helpin_translation_events_total[15m]))\", \"legendFormat\": \"{{stage}} {{direction}} {{outcome}} {{provider}} {{model}} {{kind}} {{measurement}}\"}], \"gridPos\": {\"x\": 0, \"y\": 0, \"w\": 12, \"h\": 8}, \"fieldConfig\": {\"defaults\": {\"unit\": \"short\"}, \"overrides\": []}}, {\"id\": 2, \"title\": \"Provider attempts by outcome (15m)\", \"type\": \"timeseries\", \"description\": \"Includes every actual attempt and retry, including invalid outputs. Cache reads make no provider calls.\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(stage,provider,model,outcome)(increase(helpin_translation_provider_attempts_total[15m]))\", \"legendFormat\": \"{{stage}} {{direction}} {{outcome}} {{provider}} {{model}} {{kind}} {{measurement}}\"}], \"gridPos\": {\"x\": 12, \"y\": 0, \"w\": 12, \"h\": 8}, \"fieldConfig\": {\"defaults\": {\"unit\": \"short\"}, \"overrides\": []}}, {\"id\": 3, \"title\": \"Provider latency p95\", \"type\": \"timeseries\", \"description\": \"\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"histogram_quantile(0.95,sum by(le,stage,provider,model)(rate(helpin_translation_provider_duration_seconds_bucket[15m])))\", \"legendFormat\": \"{{stage}} {{direction}} {{outcome}} {{provider}} {{model}} {{kind}} {{measurement}}\"}], \"gridPos\": {\"x\": 0, \"y\": 8, \"w\": 12, \"h\": 8}, \"fieldConfig\": {\"defaults\": {\"unit\": \"s\"}, \"overrides\": []}}, {\"id\": 4, \"title\": \"Normalized tokens by kind (15m)\", \"type\": \"timeseries\", \"description\": \"Input excludes cache reads/writes; output excludes reasoning. These five kinds are disjoint and may be summed.\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(stage,provider,model,kind)(increase(helpin_translation_tokens_total[15m]))\", \"legendFormat\": \"{{stage}} {{direction}} {{outcome}} {{provider}} {{model}} {{kind}} {{measurement}}\"}], \"gridPos\": {\"x\": 12, \"y\": 8, \"w\": 12, \"h\": 8}, \"fieldConfig\": {\"defaults\": {\"unit\": \"short\"}, \"overrides\": []}}, {\"id\": 5, \"title\": \"Estimated provider spend (selected range)\", \"type\": \"timeseries\", \"description\": \"Partial estimate from immutable admission rates. Check price coverage below. Missing rates (including unpriced Jev/Community calls) are unknown, not free. Billing ledger remains authoritative.\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(stage,provider,model)(increase(helpin_translation_estimated_provider_cost_usd_total[$__range]))\", \"legendFormat\": \"{{stage}} {{direction}} {{outcome}} {{provider}} {{model}} {{kind}} {{measurement}}\"}], \"gridPos\": {\"x\": 0, \"y\": 16, \"w\": 12, \"h\": 8}, \"fieldConfig\": {\"defaults\": {\"unit\": \"currencyUSD\"}, \"overrides\": []}}, {\"id\": 6, \"title\": \"Usage and pricing coverage (15m)\", \"type\": \"timeseries\", \"description\": \"price_missing and tokens_missing expose incomplete observability. No data means no reported samples, not zero cost.\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(stage,measurement)(increase(helpin_translation_usage_measurements_total[15m]))\", \"legendFormat\": \"{{stage}} {{direction}} {{outcome}} {{provider}} {{model}} {{kind}} {{measurement}}\"}], \"gridPos\": {\"x\": 12, \"y\": 16, \"w\": 12, \"h\": 8}, \"fieldConfig\": {\"defaults\": {\"unit\": \"short\"}, \"overrides\": []}}, {\"id\": 7, \"title\": \"Cache hit share\", \"type\": \"timeseries\", \"description\": \"Pending polls and review/send events are excluded.\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(direction)(rate(helpin_translation_events_total{outcome=\\\"cache_hit\\\"}[15m])) / clamp_min(sum by(direction)(rate(helpin_translation_events_total{outcome=~\\\"cache_hit|ready|failed\\\"}[15m])),0.000001)\", \"legendFormat\": \"{{stage}} {{direction}} {{outcome}} {{provider}} {{model}} {{kind}} {{measurement}}\"}], \"gridPos\": {\"x\": 0, \"y\": 24, \"w\": 12, \"h\": 8}, \"fieldConfig\": {\"defaults\": {\"unit\": \"percentunit\"}, \"overrides\": []}}, {\"id\": 8, \"title\": \"Jev review outcomes (15m)\", \"type\": \"timeseries\", \"description\": \"Accepted/needs_review are primary checks; shadow checks are advisory. Unavailable includes missing key and disabled review; review provider attempts distinguish these from provider failures.\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(outcome)(increase(helpin_translation_events_total{direction=\\\"review\\\"}[15m]))\", \"legendFormat\": \"{{stage}} {{direction}} {{outcome}} {{provider}} {{model}} {{kind}} {{measurement}}\"}], \"gridPos\": {\"x\": 12, \"y\": 24, \"w\": 12, \"h\": 8}, \"fieldConfig\": {\"defaults\": {\"unit\": \"short\"}, \"overrides\": []}}, {\"id\": 9, \"title\": \"Translated replies persisted (15m)\", \"type\": \"timeseries\", \"description\": \"\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum(increase(helpin_translation_events_total{direction=\\\"outgoing_reply\\\",outcome=\\\"sent\\\"}[15m]))\", \"legendFormat\": \"{{stage}} {{direction}} {{outcome}} {{provider}} {{model}} {{kind}} {{measurement}}\"}], \"gridPos\": {\"x\": 0, \"y\": 32, \"w\": 12, \"h\": 8}, \"fieldConfig\": {\"defaults\": {\"unit\": \"short\"}, \"overrides\": []}}, {\"id\": 10, \"title\": \"Provider failure share\", \"type\": \"timeseries\", \"description\": \"\", \"datasource\": \"clickhouse-operator-prometheus\", \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(stage)(rate(helpin_translation_provider_attempts_total{outcome!=\\\"success\\\"}[15m])) / clamp_min(sum by(stage)(rate(helpin_translation_provider_attempts_total[15m])),0.000001)\", \"legendFormat\": \"{{stage}} {{direction}} {{outcome}} {{provider}} {{model}} {{kind}} {{measurement}}\"}], \"gridPos\": {\"x\": 12, \"y\": 32, \"w\": 12, \"h\": 8}, \"fieldConfig\": {\"defaults\": {\"unit\": \"percentunit\"}, \"overrides\": []}}]}"
  }
}
