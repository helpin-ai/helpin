apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpin-temporal-native-interactive
  namespace: helpin
  labels:
    app: helpin-temporal-native-interactive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helpin-temporal-native-interactive
  template:
    metadata:
      labels:
        app: helpin-temporal-native-interactive
        env: prod
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-helpin-json-key
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: temporal-worker
          image: ghcr.io/helpin-ai/helpin/server:server-v0.95.74
          command: ["./temporal-worker"]
          env:
            - name: TEMPORAL_WORKER_QUEUES
              value: agent-native-interactive
          envFrom:
            - secretRef:
                name: helpin-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
