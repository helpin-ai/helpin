apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpin-temporal-automation
  namespace: helpin
  labels:
    app: helpin-temporal-automation
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  replicas: 1
  selector:
    matchLabels:
      app: helpin-temporal-automation
  template:
    metadata:
      labels:
        app: helpin-temporal-automation
        env: prod
    spec:
      terminationGracePeriodSeconds: 660
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-helpin-json-key
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: temporal-worker
          image: ghcr.io/helpin-ai/helpin/temporal-worker:server-v0.95.384
          command: ["./temporal-worker"]
          env:
            - name: TEMPORAL_WORKER_QUEUES
              value: automation-default
            - name: SUPPORT_COVERAGE_V2_MODE
              value: "disabled"
          envFrom:
            - secretRef:
                name: helpin-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
