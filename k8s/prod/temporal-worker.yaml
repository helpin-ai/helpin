apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpin-temporal-worker-engineer
  namespace: default
  labels:
    app: helpin-temporal-worker
    pool: engineer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helpin-temporal-worker
      pool: engineer
  template:
    metadata:
      labels:
        app: helpin-temporal-worker
        env: prod
        pool: engineer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-helpin-json-key
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: temporal-worker
          image: ghcr.io/helpin-ai/helpin/server:v0.0.2
          command: ["./temporal-worker"]
          env:
            - name: TEMPORAL_WORKER_QUEUES
              value: agent-engineer
          envFrom:
            - secretRef:
                name: helpin-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
