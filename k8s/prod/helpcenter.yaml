apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpin-helpcenter
  namespace: helpin
  labels:
    app: helpin-helpcenter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helpin-helpcenter
  template:
    metadata:
      labels:
        app: helpin-helpcenter
    spec:
      imagePullSecrets:
        - name: ghcr-helpin-json-key
      nodeSelector:
        node-role.kubernetes.io/worker: workload
        node.hetzner.com/type: cloud
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: helpcenter
          image: ghcr.io/helpin-ai/helpin/helpcenter:helpcenter-v0.95.88
          env:
            - name: INTERNAL_API_URL
              value: http://helpin-server-svc:8080/api
            - name: PORT
              value: "3000"
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: helpin-helpcenter-svc
  namespace: helpin
spec:
  selector:
    app: helpin-helpcenter
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
