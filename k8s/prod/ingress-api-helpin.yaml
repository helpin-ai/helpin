apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-helpin-api-cloudflare
  namespace: helpin
spec:
  ingressClassName: pp-nginx
  rules:
  - host: api.helpin.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: helpin-server-svc
            port:
              number: 8080
