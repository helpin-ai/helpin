apiVersion: batch/v1
kind: Job
metadata:
  name: helpin-server-migrate
  namespace: helpin
  labels:
    app: helpin-server-migrate
    env: prod
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: helpin-server-migrate
        env: prod
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-helpin-json-key
      containers:
        - name: migrate
          image: ghcr.io/helpin-ai/helpin/server:server-v0.95.29
          command:
            - /bin/sh
            - -lc
            - |
              if [ -x ./migrate ]; then
                exec ./migrate up
              fi
              echo "migrate binary not present in image; skipping bootstrap hook"
          envFrom:
            - secretRef:
                name: helpin-secrets
          env:
            - name: RUN_AUTO_MIGRATE
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
