apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: helpin-api
  namespace: helpin
spec:
  namespaceSelector:
    matchNames: [helpin]
  selector:
    matchLabels:
      app: helpin-server
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: helpin-product-health
  namespace: helpin
spec:
  groups:
    - name: helpin-product-health
      interval: 30s
      rules:
        - alert: HelpinAPIMetricsMissing
          expr: sum(up{namespace="helpin",job="helpin-server-svc"}) < 1 or absent(up{namespace="helpin",job="helpin-server-svc"})
          for: 5m
          labels: {severity: critical, service: helpin, alertgroup: helpin}
          annotations:
            summary: Helpin API metrics are unavailable
            description: Check API pods, port 9090 and VMServiceScrape discovery.
        - alert: HelpinAPIErrorRate
          expr: sum(rate(helpin_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(helpin_http_requests_total[5m])), 0.001) > 0.05 and sum(increase(helpin_http_requests_total{status=~"5.."}[5m])) >= 5
          for: 5m
          labels: {severity: critical, service: helpin, alertgroup: helpin}
          annotations: {summary: Helpin API has sustained server errors}
        - alert: HelpinAPISlow
          expr: histogram_quantile(0.95, sum by(le)(rate(helpin_http_duration_seconds_bucket{route!~".*health.*|.*stream.*"}[10m]))) > 2 and sum(increase(helpin_http_duration_seconds_count[10m])) > 50
          for: 10m
          labels: {severity: warning, service: helpin, alertgroup: helpin}
          annotations: {summary: Helpin API p95 latency exceeds two seconds}
        - alert: HelpinWidgetUploadFailures
          expr: sum(increase(helpin_widget_events_total{stage="upload",outcome=~"error|timeout|not_connected"}[15m])) >= 3
          for: 2m
          labels: {severity: warning, service: helpin, alertgroup: helpin}
          annotations: {summary: Helpin visitors are reporting upload failures, description: Inspect stage and browser breakdown. Client telemetry is best effort and may miss completely disconnected clients.}
        - alert: HelpinWidgetConnectionFailures
          expr: sum(increase(helpin_widget_events_total{stage="connection",outcome="error"}[15m])) >= 10
          for: 5m
          labels: {severity: warning, service: helpin, alertgroup: helpin}
          annotations: {summary: Helpin widget connections are repeatedly dropping}
        - alert: HelpinWidgetSmokeFailed
          expr: min_over_time(helpin_widget_smoke_success[10m]) == 0
          for: 1m
          labels: {severity: critical, service: helpin, alertgroup: helpin}
          annotations: {summary: Helpin live widget upload smoke failed, description: Check the latest helpin-widget-smoke Job logs for its sanitized failure stage. Cleanup failures also fail the check.}
        - alert: HelpinWidgetSmokeMissing
          expr: time() - helpin_widget_smoke_last_run_seconds > 900 or absent(helpin_widget_smoke_last_run_seconds{browser="chromium"}) or absent(helpin_widget_smoke_last_run_seconds{browser="firefox"})
          for: 5m
          labels: {severity: critical, service: helpin, alertgroup: helpin}
          annotations: {summary: Helpin scheduled browser checks have stopped reporting}
        - alert: HelpinJevErrors
          expr: sum(increase(helpin_ai_decisions_total{operation=~"routing|tagging",outcome="error"}[15m])) >= 3
          for: 2m
          labels: {severity: warning, service: helpin, alertgroup: helpin}
          annotations: {summary: Helpin AI routing or tagging has repeated errors}
        - alert: HelpinJevFallbackRate
          expr: sum(increase(helpin_ai_decisions_total{operation="routing_selection",outcome="fallback"}[30m])) / clamp_min(sum(increase(helpin_ai_decisions_total{operation="routing_selection"}[30m])),1) > 0.5 and sum(increase(helpin_ai_decisions_total{operation="routing_selection"}[30m])) >= 20
          for: 10m
          labels: {severity: warning, service: helpin, alertgroup: helpin}
          annotations: {summary: More than half of Helpin AI routing attempts require fallback, description: "Low confidence, policy skips and provider errors can all cause fallback; inspect decision outcomes before changing thresholds."}
        - alert: HelpinBackgroundWorkerErrors
          expr: sum by(worker)(increase(helpin_background_errors_total[15m])) >= 3
          for: 5m
          labels: {severity: warning, service: helpin, alertgroup: helpin}
          annotations: {summary: A Helpin background worker is repeatedly failing}
        - alert: HelpinTranslationProviderFailures
          expr: sum by(stage)(rate(helpin_translation_provider_attempts_total{outcome!="success"}[10m])) / clamp_min(sum by(stage)(rate(helpin_translation_provider_attempts_total[10m])), 0.000001) > 0.05 and sum by(stage)(increase(helpin_translation_provider_attempts_total[10m])) >= 20
          for: 5m
          labels: {severity: warning, service: helpin, alertgroup: helpin}
          annotations: {summary: Translation provider failures exceed five percent, description: Check the Support translation dashboard for provider errors, invalid outputs and usage settlement failures.}
        - alert: HelpinTranslationSlow
          expr: histogram_quantile(0.95, sum by(le,stage)(rate(helpin_translation_provider_duration_seconds_bucket[10m]))) > 15 and sum by(stage)(increase(helpin_translation_provider_duration_seconds_count[10m])) >= 20
          for: 10m
          labels: {severity: warning, service: helpin, alertgroup: helpin}
          annotations: {summary: Translation provider p95 latency exceeds fifteen seconds}
