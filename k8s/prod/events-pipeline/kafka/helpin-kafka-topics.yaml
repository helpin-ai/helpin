# Strimzi KafkaTopics — applied in the eventpipeline namespace.
# Partition counts sized for initial helpin traffic; scale up as needed.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: helpin.events.raw
  namespace: eventpipeline
  labels:
    strimzi.io/cluster: cluster
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: "604800000"       # 7 days
    cleanup.policy: delete
    compression.type: lz4
    min.insync.replicas: "2"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: helpin.events.enriched
  namespace: eventpipeline
  labels:
    strimzi.io/cluster: cluster
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: "604800000"       # 7 days
    cleanup.policy: delete
    compression.type: lz4
    min.insync.replicas: "2"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: helpin.events.enriched.dlq
  namespace: eventpipeline
  labels:
    strimzi.io/cluster: cluster
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: "2592000000"      # 30 days — keep DLQ longer for investigation
    cleanup.policy: delete
    compression.type: lz4
    min.insync.replicas: "2"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
