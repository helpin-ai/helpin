# Strimzi KafkaUser — SCRAM-SHA-512 with least-privilege ACLs.
# Applied in the eventpipeline namespace where the Kafka cluster lives.
# Strimzi will auto-create a secret "helpin-eventpipeline" in this namespace
# containing the SCRAM password. Copy the password into Doppler as KAFKA_PASSWORD.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: helpin-eventpipeline
  namespace: eventpipeline
  labels:
    strimzi.io/cluster: cluster
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      # ── Producer: capture service writes raw events ──
      - resource:
          type: topic
          name: helpin.events.raw
          patternType: literal
        operations:
          - Write
          - Describe
          - Create
        host: "*"

      # ── Enrichment: reads raw, writes enriched + DLQ ──
      - resource:
          type: topic
          name: helpin.events.raw
          patternType: literal
        operations:
          - Read
          - Describe
        host: "*"
      - resource:
          type: topic
          name: helpin.events.enriched
          patternType: literal
        operations:
          - Write
          - Read
          - Describe
          - Create
        host: "*"
      - resource:
          type: topic
          name: helpin.events.enriched.dlq
          patternType: literal
        operations:
          - Write
          - Describe
          - Create
        host: "*"

      # ── KStreams: reads enriched, writes sessionized ──
      - resource:
          type: topic
          name: helpin.events.sessionized
          patternType: literal
        operations:
          - Write
          - Read
          - Describe
          - Create
        host: "*"

      # ── KStreams internal topics (changelogs, repartition) ──
      - resource:
          type: topic
          name: helpin-eventpipeline-kstreams
          patternType: prefix
        operations:
          - Write
          - Read
          - Describe
          - Create
          - Delete
        host: "*"

      # ── Consumer groups ──
      - resource:
          type: group
          name: helpin-
          patternType: prefix
        operations:
          - Read
          - Describe
        host: "*"

      # ── Transactional IDs (for exactly-once in kstreams) ──
      - resource:
          type: transactionalId
          name: helpin-
          patternType: prefix
        operations:
          - Write
          - Describe
        host: "*"
