apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpin-eventpipeline-web
  labels:
    app: helpin-eventpipeline-web
  namespace: helpin
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: helpin-eventpipeline-web
  template:
    metadata:
      labels:
        app: helpin-eventpipeline-web
    spec:
      imagePullSecrets:
        - name: ghcr-helpin-json-key
      # TLS init container commented out — using SCRAM auth for now.
      # Uncomment when migrating to mTLS.
      # initContainers:
      #   - name: secret-to-file
      #     image: alpine
      #     command:
      #       - /bin/sh
      #       - -c
      #       - |
      #         mkdir -p /data/tls/producer && mkdir -p /data/tls/consumer
      #         echo "$PRODUCER_CA_CRT"  > /data/tls/producer/ca.crt
      #         echo "$PRODUCER_CLIENT_CRT"  > /data/tls/producer/client.crt
      #         echo "$PRODUCER_CLIENT_KEY"  > /data/tls/producer/client.key
      #         echo "$CONSUMER_CA_CRT"  > /data/tls/consumer/ca.crt
      #         echo "$CONSUMER_CLIENT_CRT"  > /data/tls/consumer/client.crt
      #         echo "$CONSUMER_CLIENT_KEY"  > /data/tls/consumer/client.key
      #     env:
      #       - name: PRODUCER_CA_CRT
      #         valueFrom:
      #           secretKeyRef:
      #             name: helpin-cluster-ca-cert
      #             key: ca.crt
      #       - name: PRODUCER_CLIENT_CRT
      #         valueFrom:
      #           secretKeyRef:
      #             name: helpin-eventpipeline-capture
      #             key: user.crt
      #       - name: PRODUCER_CLIENT_KEY
      #         valueFrom:
      #           secretKeyRef:
      #             name: helpin-eventpipeline-capture
      #             key: user.key
      #       - name: CONSUMER_CA_CRT
      #         valueFrom:
      #           secretKeyRef:
      #             name: helpin-cluster-ca-cert
      #             key: ca.crt
      #       - name: CONSUMER_CLIENT_CRT
      #         valueFrom:
      #           secretKeyRef:
      #             name: helpin-eventpipeline-transform
      #             key: user.crt
      #       - name: CONSUMER_CLIENT_KEY
      #         valueFrom:
      #           secretKeyRef:
      #             name: helpin-eventpipeline-transform
      #             key: user.key
      #     volumeMounts:
      #       - name: secret-volume
      #         mountPath: /data/tls
      containers:
        - name: main
          image: ghcr.io/helpin-ai/helpin/events-pipeline:ep-v0.1.10
          command: ["events-pipeline"]
          envFrom:
            - secretRef:
                name: helpin-secrets
          env:
            - name: HTTP_TOKENS_URL
              value: http://helpin-server-svc.helpin.svc.cluster.local:8080/api/internal/widget-tokens
            - name: NETWORK_ENRICHMENT_ENABLED
              value: "true"
            - name: NATS_URL
              value: tls://helpin-eventpipeline-nats.helpin.svc.cluster.local:4222
            - name: NATS_USERNAME
              value: capture
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helpin-eventpipeline-nats-secrets
                  key: capture-password
            - name: NATS_CA_FILE
              value: /etc/nats/tls/ca.crt
            - name: NATS_CLIENT_CERT_FILE
              value: /etc/nats/tls/tls.crt
            - name: NATS_CLIENT_KEY_FILE
              value: /etc/nats/tls/tls.key
            - name: ARCHIVE_SPILL_DIR
              value: /app/data/archive-spill/capture
            - name: ARCHIVE_SPILL_MAX_BYTES
              value: "536870912"
            - name: NATS_WORK_MAX_IN_FLIGHT
              value: "512"
            - name: RAW_ARCHIVE_ENABLED
              value: "true"
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/liveness
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            # - name: secret-volume        # Uncomment for mTLS
            #   mountPath: /app/data/tls
            - name: fallback-volume
              mountPath: /app/data/fallback
            - name: archive-spill-volume
              mountPath: /app/data/archive-spill
            - name: nats-client-tls
              mountPath: /etc/nats/tls
              readOnly: true
        - name: replay-worker
          image: ghcr.io/helpin-ai/helpin/events-pipeline:ep-v0.1.10
          command: ["replay-worker"]
          envFrom:
            - secretRef:
                name: helpin-secrets
          env:
            - name: NETWORK_ENRICHMENT_ENABLED
              value: "true"
            - name: NATS_URL
              value: tls://helpin-eventpipeline-nats.helpin.svc.cluster.local:4222
            - name: NATS_USERNAME
              value: capture
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helpin-eventpipeline-nats-secrets
                  key: capture-password
            - name: NATS_CA_FILE
              value: /etc/nats/tls/ca.crt
            - name: NATS_CLIENT_CERT_FILE
              value: /etc/nats/tls/tls.crt
            - name: NATS_CLIENT_KEY_FILE
              value: /etc/nats/tls/tls.key
            - name: ARCHIVE_SPILL_DIR
              value: /app/data/archive-spill/replay
            - name: ARCHIVE_SPILL_MAX_BYTES
              value: "536870912"
            - name: NATS_WORK_MAX_IN_FLIGHT
              value: "512"
            - name: RAW_ARCHIVE_ENABLED
              value: "true"
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: "200m"
              memory: 256Mi
          volumeMounts:
            # - name: secret-volume        # Uncomment for mTLS
            #   mountPath: /app/data/tls
            - name: fallback-volume
              mountPath: /app/data/fallback
            - name: archive-spill-volume
              mountPath: /app/data/archive-spill
            - name: nats-client-tls
              mountPath: /etc/nats/tls
              readOnly: true
      volumes:
        # - name: secret-volume            # Uncomment for mTLS
        #   emptyDir: {}
        - name: fallback-volume
          emptyDir:
            sizeLimit: 10Gi
        - name: archive-spill-volume
          emptyDir:
            sizeLimit: 512Mi
        - name: nats-client-tls
          secret:
            secretName: helpin-eventpipeline-nats-capture-tls
---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  namespace: helpin
  labels:
    app: helpin-eventpipeline-web
  name: helpin-eventpipeline-web
spec:
  ports:
    - name: helpin-eventpipeline-web-port
      port: 80
      protocol: TCP
      targetPort: 3000
    - name: helpin-eventpipeline-metrics-port
      port: 81
      protocol: TCP
      targetPort: 3001
  selector:
    app: helpin-eventpipeline-web
  type: ClusterIP
status:
  loadBalancer: {}
