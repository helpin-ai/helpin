apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: helpin-eventpipeline-selfsigned
  namespace: helpin
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: helpin-eventpipeline-nats-ca
  namespace: helpin
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  isCA: true
  commonName: helpin-eventpipeline-nats-ca
  secretName: helpin-eventpipeline-nats-ca
  privateKey:
    rotationPolicy: Never
  duration: 87600h
  renewBefore: 720h
  issuerRef:
    name: helpin-eventpipeline-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: helpin-eventpipeline-nats-ca
  namespace: helpin
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  ca:
    secretName: helpin-eventpipeline-nats-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: helpin-eventpipeline-nats-server
  namespace: helpin
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  secretName: helpin-eventpipeline-nats-server-tls
  privateKey:
    rotationPolicy: Always
  duration: 2160h
  renewBefore: 360h
  commonName: helpin-eventpipeline-nats
  dnsNames:
    - helpin-eventpipeline-nats
    - helpin-eventpipeline-nats.helpin
    - helpin-eventpipeline-nats.helpin.svc
    - helpin-eventpipeline-nats.helpin.svc.cluster.local
    - helpin-eventpipeline-nats-headless
    - helpin-eventpipeline-nats-headless.helpin
    - helpin-eventpipeline-nats-headless.helpin.svc
    - helpin-eventpipeline-nats-headless.helpin.svc.cluster.local
    - "*.helpin-eventpipeline-nats-headless.helpin.svc.cluster.local"
  usages:
    - server auth
    - client auth
  issuerRef:
    name: helpin-eventpipeline-nats-ca
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: helpin-eventpipeline-nats-capture
  namespace: helpin
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  secretName: helpin-eventpipeline-nats-capture-tls
  privateKey:
    rotationPolicy: Always
  duration: 2160h
  renewBefore: 360h
  commonName: helpin-eventpipeline-capture
  usages: [client auth]
  issuerRef:
    name: helpin-eventpipeline-nats-ca
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: helpin-eventpipeline-nats-writer
  namespace: helpin
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  secretName: helpin-eventpipeline-nats-writer-tls
  privateKey:
    rotationPolicy: Always
  duration: 2160h
  renewBefore: 360h
  commonName: helpin-eventpipeline-writer
  usages: [client auth]
  issuerRef:
    name: helpin-eventpipeline-nats-ca
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: helpin-eventpipeline-nats-ops
  namespace: helpin
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  secretName: helpin-eventpipeline-nats-ops-tls
  privateKey:
