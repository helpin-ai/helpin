apiVersion: batch/v1
kind: CronJob
metadata:
  name: helpin-widget-smoke
  namespace: helpin
spec:
  # Verified live in Chromium and Firefox, including readback and cleanup.
  suspend: false
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app: helpin-widget-smoke}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          volumes:
            - name: config
              configMap: {name: helpin-widget-smoke}
            - name: deps
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: shm
              emptyDir: {medium: Memory, sizeLimit: 256Mi}
          initContainers:
            - name: dependencies
              image: node:22.22.1-bookworm-slim
              command: [sh, -ec]
              args: ['cp /config/package*.json /deps/; npm ci --prefix /deps --omit=dev --ignore-scripts --cache /tmp/npm']
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: "1", memory: 512Mi}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: config, mountPath: /config, readOnly: true}
                - {name: deps, mountPath: /deps}
                - {name: tmp, mountPath: /tmp}
          containers:
            - name: smoke
              image: mcr.microsoft.com/playwright:v1.58.2-noble
              command: [node, /config/smoke.cjs]
              env:
                - {name: NODE_PATH, value: /deps/node_modules}
                - {name: HOME, value: /tmp}
                - {name: SMOKE_SITE, value: 'https://helpin.ai/'}
                - {name: SMOKE_METRICS_URL, value: 'http://vminsert-vm.monitoring.svc:8480/insert/0/prometheus/api/v1/import/prometheus'}
              resources:
                requests: {cpu: 250m, memory: 384Mi}
                limits: {cpu: "2", memory: 1Gi}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: config, mountPath: /config, readOnly: true}
                - {name: deps, mountPath: /deps, readOnly: true}
                - {name: tmp, mountPath: /tmp}
                - {name: shm, mountPath: /dev/shm}
