apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpin-server
  namespace: helpin
  labels:
    app: helpin-server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app: helpin-server
  template:
    metadata:
      labels:
        app: helpin-server
        env: prod
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-helpin-json-key
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-data
          emptyDir: {}
      containers:
        - name: helpin-server
          image: ghcr.io/helpin-ai/helpin/server:server-v0.95.403
          envFrom:
            - secretRef:
                name: helpin-secrets
          env:
            - name: CLICKHOUSE_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helpin-eventpipeline-secrets
                  key: CLICKHOUSE_API_PASSWORD
            - name: CLICKHOUSE_DSN
              value: clickhouse://helpin_api:$(CLICKHOUSE_API_PASSWORD)@helpin-clickhouse.helpin.svc.cluster.local:9000/helpin
            - name: RUN_AUTO_MIGRATE
              value: "true"
            - name: SUPPORT_COVERAGE_V2_MODE
              value: "disabled"
            - name: MCP_PUBLIC_BASE_URL
              value: "https://mcp.helpin.ai"
            - name: MCP_SERVER_ENABLED
              value: "true"
            - name: GOMEMLIMIT
              value: "2750MiB"
          resources:
            requests:
              cpu: 750m
              memory: 1536Mi
            limits:
              cpu: "3"
              memory: 3Gi
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-data
              mountPath: /app/data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: helpin-server-svc
  namespace: helpin
  labels:
    app: helpin-server
spec:
  ports:
    - name: helpin-server-port
      port: 8080
      targetPort: 8080
  selector:
    app: helpin-server
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: helpin-server
  namespace: helpin
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: helpin-server
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: helpin-server
  namespace: helpin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: helpin-server
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 65
