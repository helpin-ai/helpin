apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpin-server
  namespace: helpin
  labels:
    app: helpin-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helpin-server
  template:
    metadata:
      labels:
        app: helpin-server
        env: prod
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: helpin-server
          image: ghcr.io/helpin-ai/helpin/server:prod-latest
          envFrom:
            - secretRef:
                name: helpin-secrets
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: helpin-server-svc
  namespace: helpin
  labels:
    app: helpin-server
spec:
  ports:
    - name: helpin-server-port
      port: 8080
      targetPort: 8080
  selector:
    app: helpin-server
  type: ClusterIP
