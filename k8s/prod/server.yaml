apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpin-server
  namespace: helpin
  labels:
    app: helpin-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helpin-server
  template:
    metadata:
      labels:
        app: helpin-server
        env: prod
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-helpin-json-key
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-data
          emptyDir: {}
      containers:
        - name: helpin-server
          image: ghcr.io/helpin-ai/helpin/server:server-v0.95.74
          envFrom:
            - secretRef:
                name: helpin-secrets
          env:
            - name: RUN_AUTO_MIGRATE
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-data
              mountPath: /app/data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: helpin-server-svc
  namespace: helpin
  labels:
    app: helpin-server
spec:
  ports:
    - name: helpin-server-port
      port: 8080
      targetPort: 8080
  selector:
    app: helpin-server
  type: ClusterIP
