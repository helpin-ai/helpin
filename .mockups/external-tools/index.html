<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>External tools · Helpin settings preview</title>
<style>
:root{color-scheme:light;font:14px/1.4 system-ui,sans-serif;color:#272624;background:#f5f5f4}
*{box-sizing:border-box}
body{margin:0}
main{max-width:1760px;margin:auto;padding:0 14px 12px}
header{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:14px;font-weight:600;margin:0}
.controls{display:flex;align-items:center;gap:14px}
select,.full{font:inherit;font-size:13px;color:inherit}
select{background:#fff;border:1px solid #d6d3d1;border-radius:6px;padding:4px 7px}
.full{text-underline-offset:3px}
.scene{position:relative;width:min(100%,calc((100dvh - 68px) * 1.6));margin:0 auto;background:#fff;outline:1px solid #deddda;aspect-ratio:1440/900}
.scene img{display:block;width:100%;height:auto}
.spot{display:block;position:absolute;border-radius:4px}
.spot:hover{box-shadow:inset 0 0 0 1px #77777766;background:#77777709}
.spot:focus-visible,select:focus-visible,.full:focus-visible{outline:2px solid #6d592a;outline-offset:2px}
@media(max-width:700px){
 main{padding:0 6px 8px}
 header{padding:6px 2px;gap:4px}
 .scene{width:100%;max-width:430px;aspect-ratio:430/820}
 .controls{gap:6px}
 h1,.full,select{font-size:12px}
}
</style>
</head>
<body>
<main>
<header>
 <h1>Helpin settings preview</h1>
 <div class="controls">
 <select id="screens" aria-label="Preview screen">
  <optgroup label="External tools">
   <option value="apps">Apps · Connected Slack</option>
   <option value="connect">Apps · Connect Slack</option>
   <option value="support">Slack · Support channel</option>
   <option value="project">Slack · Project channel</option>
   <option value="mcp">MCP servers</option>
   <option value="tools">MCP server · Tool permissions</option>
  </optgroup>
  <option value="channels">Support · Channels</option>
 </select>
 <a id="full" class="full" href="apps.png?v=2" target="_blank" rel="noopener">Full size</a>
 </div>
</header>
<div class="scene" aria-label="Settings screenshots">
 <img id="screen" src="apps.png?v=2" alt="External tools, Apps tab with Slack connected.">
 <nav id="actions" aria-label="Explore this screen"></nav>
</div>
</main>

const descriptions = {
 apps:'Apps tab in External tools. Slack is connected to Northstar, with a customer support channel and a project channel.',
 connect:'Apps before installation. Connect Slack adds a workspace connection.',
 support:'The Slack channel acme-support routes customer threads to the Customer support inbox.',
 project:'The Slack channel payments defaults new tasks to the Payments team and the Checkout reliability epic.',
 mcp:'MCP servers tab with Northstar knowledge connected, two of three tools enabled, and agent access controls.',
 tools:'The MCP tool list shows tool names, enablement, and read or write access.',
 channels:'The Support Channels page has Manage shortcuts for Chat, Email, and Slack, followed by the Telegram settings.'
}
const narrow=matchMedia('(max-width:700px)')
const picker=document.getElementById('screens'), actions=document.getElementById('actions'), screen=document.getElementById('screen')
function show(){
 const hash=location.hash.slice(1)
 const id=Object.hasOwn(descriptions,hash)?hash:'apps'
 const key=id+(narrow.matches?'-mobile':'')
 picker.value=id
 document.title=picker.selectedOptions[0].text+' · Helpin settings preview'
 screen.src=key+'.png?v=2'
 screen.alt=descriptions[id]
 document.getElementById('full').href=screen.getAttribute('src')
 actions.replaceChildren(...hotspots[key].filter(box=>box.to!==id).map(box=>{
  const a=document.createElement('a')
  a.href='#'+box.to
  a.setAttribute('aria-label',box.label)
  a.title=box.label
  a.className='spot'
  Object.assign(a.style,{left:box.x+'%',top:box.y+'%',width:box.w+'%',height:box.h+'%'})
  return a
 }))
}
picker.addEventListener('change',()=>{location.hash=picker.value})
narrow.addEventListener('change',show)
window.addEventListener('hashchange',show)
show()
