<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slack in Helpin · Product screenshots</title>
  <style>
    :root { color-scheme:light; font:14px/1.45 system-ui,sans-serif; color:#202124; background:#f6f7f8 }
    * { box-sizing:border-box }
    body { margin:0 }
    main { max-width:1680px; margin:auto; padding:12px clamp(10px,1.6vw,26px) 16px }
    header, nav, .heading { display:flex; align-items:center; flex-wrap:wrap }
    header { justify-content:space-between; gap:8px 20px; margin-bottom:10px }
    .heading { gap:4px 10px }
    h1 { margin:0; font-size:17px; letter-spacing:-.035em }
    .heading span, figcaption { color:#5c626a; font-size:13px }
    nav { gap:2px }
    nav a { color:inherit; text-decoration:none; padding:6px 9px; border-radius:5px; font-size:13px }
    nav a:hover { background:#e6e8eb }
    nav a[aria-current] { background:#22262c; color:white }
    figure { margin:0 }
    figure > a { display:block; width:fit-content; max-width:100%; margin:auto }
    img { display:block; width:auto; height:auto; max-width:100%; max-height:calc(100dvh - 94px); border:1px solid #d9dde2; background:white; cursor:zoom-in }
    figcaption { text-align:center; margin:8px auto 0; max-width:75ch }
    figcaption a { color:inherit; margin-inline-start:0.5em; text-underline-offset:2px }
    @media (max-width:650px) {
      main { padding:10px 8px }
      nav { gap:0 }
      nav a { padding:6px 7px }
      img { max-height:calc(100dvh - 165px) }
    }
  </style>
</head>
<body><main>
  <header>
    <div class="heading"><h1>Slack in Helpin</h1><span>Northstar · Fictional workspace</span></div>
    <nav aria-label="Screenshots">
      <a href="#inbox">Conversation</a><a href="#mixed-channels">Reply channels</a><a href="#list">Inbox list</a><a href="#task">Linked task</a>
      <a href="#channels">Channels</a><a href="#routing">Support routing</a><a href="#project-routing">PM defaults</a>
    </nav>
  </header>
  <figure>
    <a id="full" href="inbox.png?v=7" title="Open full-resolution screenshot">
      <img id="screen" src="inbox.png?v=7" alt="Helpin support inbox showing Lena’s Slack thread and its linked task.">
    </a>
    <figcaption aria-live="polite"><span id="caption"></span><a id="incoming" href="incoming-detail.png?v=7" hidden>Enlarge message</a><a id="detail" hidden></a></figcaption>
  </figure>
</main>
<script>
  const captions = {
    inbox: 'Lena’s messages link to their originals in Slack. Sam’s draft goes to #acme-support.',
    'mixed-channels': 'Lena can receive a reply in Chat, Slack, Telegram, or email. Sam has selected #acme-support with an email copy.',
    list: 'The Customer support inbox on a narrow screen. Slack, email, and chat conversations share the same queue.',
    task: 'Ana’s update on PAY-142 shows where replies will sync in Slack.',
    channels: 'Slack’s Manage shortcut opens External tools → Apps. Chat, Email, and Telegram are also available here.',
    routing: 'Customer threads in #acme-support go to the Customer support inbox.',
    'project-routing': 'Tasks drafted from #payments start with the Payments team and the Checkout reliability epic.'
  }
  function show() {
    const hash = location.hash.slice(1)
    const id = Object.hasOwn(captions, hash) ? hash : 'inbox'
    for (const link of document.querySelectorAll('nav a')) {
      if (link.hash === '#' + id) link.setAttribute('aria-current', 'page')
      else link.removeAttribute('aria-current')
    }
    const file = id + '.png?v=7'
    document.getElementById('screen').src = file
    document.getElementById('screen').alt = captions[id]
    document.getElementById('full').href = file
    document.getElementById('caption').textContent = captions[id]
    document.getElementById('incoming').hidden = id !== 'inbox'
    const detail = document.getElementById('detail')
    const detailName = { inbox: 'composer', task: 'comment' }[id]
    detail.hidden = !detailName
    if (detailName) {
      detail.href = detailName + '-detail.png?v=7'
      detail.textContent = 'Enlarge ' + detailName
    }
  }
  window.addEventListener('hashchange', show)
  show()
</script>
</body>
</html>
